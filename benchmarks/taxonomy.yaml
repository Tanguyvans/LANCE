  provisioning_telemetry: {device: sensor, protocols: [http]}
  modbus_server: {device: ot_controller}
  ot_opcua_server: {device: ot_controller}
  ot_bacnet_server: {device: ot_controller}
  ot_hmi: {device: ot_supervision}
  ot_historian: {device: ot_supervision}
  nodered_server: {device: iot_platform}
  api_identity_server: {device: iot_platform}
