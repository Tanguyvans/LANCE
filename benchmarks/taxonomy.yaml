# Taxonomie des trois axes du benchmark : appareil, architecture, faille.
#
# Ce fichier ne déclare aucun scénario. Il fait correspondre les valeurs
# brutes déjà présentes dans le dépôt aux classes utilisées pour organiser
# le corpus (présentation du 2026-10-23) :
#   - rôle d'un service (topologies, vérités terrain) → classe d'appareil ;
#   - topologie d'un scénario → architecture visée ;
#   - catégorie d'une faille (vérités terrain) → famille de faille.
# L'architecture visée est l'intention du scénario. src/benchmark/taxonomy.py
# mesure en plus l'architecture réellement encodée dans la topologie
# (sous-réseaux, hôtes relais à double interface, services sans passerelle)
# et signale tout écart : un écart est un scénario à mettre en conformité.
# Les étiquettes par scénario et par faille sont dérivées par ce module ;
# elles ne sont jamais saisies à la main.
schema_version: 1

classes:
  device:
    router: routeur OpenWrt du scénario
    gateway: passerelle IoT ou pont vers les appareils
    broker: courtier de messages IoT
    camera: caméra IP ou enregistreur vidéo
    sensor: capteur ou appareil terminal contraint
    ot_controller: automate ou contrôleur industriel/bâtiment
    ot_supervision: IHM ou historian OT
    iot_platform: plateforme ou API de gestion IoT
    cloud_service: service cloud simulé
    identity_service: PKI, enrôlement ou registre d'identités
    update_service: dépôt, signature ou suivi de mises à jour
    host: hôte Linux administré par SSH
    web_app: application web de laboratoire
    database: base de données
    file_server: serveur de fichiers
    network_service: service d'administration réseau
  architecture:
    flat: un seul segment, chaque service est joignable directement
    segmented: plusieurs zones routées et filtrées par le routeur
    gateway: services isolés joignables seulement par une passerelle exposée
    multi_hop: cible atteignable seulement par au moins deux relais successifs
    star: appareils périphériques joignables seulement par un nœud central
    local_cloud: site local et service distant sur des segments séparés
  weakness:
    authentication: identifiants par défaut, absence ou contournement d'authentification
    access_control: autorisation défaillante ou élévation de privilèges
    data_exposure: données sensibles ou informations techniques exposées
    injection: injection de code ou de commande
    crypto: chiffrement faible ou absent
    configuration: mauvaise configuration ou durcissement manquant
    update: mise à jour non sûre
    known_vulnerability: version affectée par une CVE publique

# Rôle → classe d'appareil. Les protocoles viennent de
# src/benchmark/tool_registry.py:ROLE_SERVICES ; `protocols` n'est renseigné
# que pour les rôles absents de ce registre.
