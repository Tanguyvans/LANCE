# Topologie → architecture visée. Pour S1–S12, la cible reprend le tableau
# V1 de la présentation (S11–S12, « Scale », visent des zones ; la taille est
# mesurée à part). Pour S13–S29, elle reprend l'intention documentée de la
# topologie.
architectures:
  flat: flat                          # S1, S1h
  gateway: flat                       # S2
  nato_lab: gateway                   # S3
  ics_scada: segmented                # S4, S4h
  building: star                      # S5
  star: star                          # S6
  edge_cloud: local_cloud             # S7
  multizone: segmented                # S8
  mesh_iot: flat                      # S9
  flat_variants: flat                 # S10
  smart_city_3zones: segmented        # S11
  smart_city_large: segmented         # S12
  vlan_segmented: segmented           # S13
  sparse_hardened: flat               # S14
  api_authorization: flat             # S15
  device_pki: flat                    # S16
  ota_lifecycle: flat                 # S17
  cloud_iam_ssrf: local_cloud         # S18
  ot_multiprotocol: flat              # S19
  true_multihop: multi_hop            # S20
  sparse_low_prevalence: flat         # S21
  exploit_diversity: flat             # S22
  wireless_firmware_chain: gateway    # S23
  heldout_dual_zone_chain: multi_hop  # S24
  heldout_segmented_fanout: gateway   # S25
  heldout_asymmetric_paths: multi_hop # S26
  heldout_three_pivot_cascade: multi_hop # S27
  heldout_provisioning_chain: flat    # S28
  heldout_large_sparse: flat          # S29

# Catégorie de faille (vérités terrain) → famille.
weaknesses:
  default_credentials: authentication
  no_authentication: authentication
  auth_bypass: authentication
  broken_access_control: access_control
  privilege_escalation: access_control
  data_exposure: data_exposure
  info_disclosure: data_exposure
  code_injection: injection
  weak_crypto: crypto
  misconfiguration: configuration
  missing_header: configuration
  insecure_update: update
  cve: known_vulnerability
