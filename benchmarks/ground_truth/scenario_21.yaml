vulnerabilities:
- id: F17-MQTT-ANONYMOUS@s21-mqtt-open
  device: s21-mqtt-open
  ip: 192.168.100.11
  role: mqtt_broker
  security_profile: vulnerable
  template_key: F17-MQTT-ANONYMOUS
  title: MQTT broker permits anonymous subscription
  severity: high
  category: no_authentication
  hop_depth: 0
  exploit_eligible: true
  owasp_iot: I2 - Insecure Network Services
  description: Anonymous subscription receives a retained benchmark message.
  indicators:
  - 'Unauthenticated subscription to # succeeds'
  network_pivot_depth: 0
  dependency_depth: 0
  accepted_types:
  - data_exposure
  services:
  - http
  ports:
  - 80
  protocols:
  - tcp
  verification: subscribe without credentials to 192.168.100.11:1883
  confidence_required: high
  endpoints:
  - /backup/db_backup_2024-01-15.sql
- id: F17-WEB-BACKUP@s21-web-backup
  device: s21-web-backup
  ip: 192.168.100.12
  role: web_server
  security_profile: vulnerable
  template_key: F17-WEB-BACKUP
  title: Web server exposes a directory-indexed database backup
  severity: high
  category: data_exposure
  hop_depth: 0
  exploit_eligible: true
  owasp_iot: I7 - Insecure Data Transfer and Storage
  description: The backup directory and bounded SQL fixture are accessible without
    authentication.
  indicators:
  - GET /backup/ returns an index
  - SQL fixture contains benchmark credentials
  verification: retrieve http://192.168.100.12/backup/db_backup_2024-01-15.sql
  confidence_required: high
