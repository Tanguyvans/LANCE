  severity: high
  category: data_exposure
  hop_depth: 1
  network_pivot_depth: 1
  dependency_depth: 0
  accepted_types: &id001
  - data_exposure
  - no_authentication
  services: &id002
  - http
  ports: &id003
  - 8080
  protocols: &id004
  - tcp
  endpoints: &id005
  - /export
  exploit_eligible: true
  owasp_iot: I7 - Insecure Data Transfer and Storage
