controls:
- id: C20-PIVOT-PASSWORD-OFF@s25-gateway-control
  device: s25-gateway-control
  ip: 192.168.100.14
  role: heldout_entry
  security_profile: hardened
  template_key: C20-PIVOT-PASSWORD-OFF
  assertion: pivot_password_authentication_disabled
  forbidden_types:
  - default_credentials
  - weak_authentication
  description: The comparator remains reachable but offers public-key authentication
    only.
  verification: SSH authentication methods on 192.168.100.14:22 omit password
- id: C20-ASSET-L1-AUTH@s25-telemetry-control
  device: s25-telemetry-control
  ip: 192.168.134.15
  role: heldout_asset_l1
  security_profile: hardened
  template_key: C20-ASSET-L1-AUTH
  assertion: isolated_export_requires_authentication
  forbidden_types: &id006
