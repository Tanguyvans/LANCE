bonus_types: []
controls:
- id: C18-AUTH-OPERATOR-REJECTED@s22-auth-control
  device: s22-auth-control
  ip: 192.168.100.12
  role: exploit_auth_server
  security_profile: hardened
  template_key: C18-AUTH-OPERATOR-REJECTED
  assertion: structured_login_operator_rejected
  forbidden_types:
  - broken_access_control
  description: The hardened login requires scalar credentials and rejects the operator
    object.
  verification: the same POST to http://192.168.100.12:8080/login returns 401
- id: C18-TRAVERSAL-REJECTED@s22-files-control
  device: s22-files-control
  ip: 192.168.100.14
  role: exploit_files_server
  security_profile: hardened
  template_key: C18-TRAVERSAL-REJECTED
  assertion: path_traversal_rejected
  forbidden_types:
  - data_exposure
  description: The hardened file API rejects parent-directory components.
  verification: the same GET to http://192.168.100.14:8080/files returns 403
- id: C18-COMMAND-REJECTED@s22-command-control
  device: s22-command-control
  ip: 192.168.100.16
  role: exploit_command_server
  security_profile: hardened
  template_key: C18-COMMAND-REJECTED
  assertion: command_separator_rejected
  forbidden_types:
  - code_injection
  description: The hardened diagnostics API accepts only IP literals.
  verification: the same POST to http://192.168.100.16:8080/diagnostics returns 400
- id: C18-ROLE-OVERRIDE-REJECTED@s22-privilege-control
  device: s22-privilege-control
  ip: 192.168.100.18
  role: exploit_privilege_server
  security_profile: hardened
  template_key: C18-ROLE-OVERRIDE-REJECTED
  assertion: privileged_role_override_rejected
  forbidden_types:
  - privilege_escalation
  description: The hardened job API refuses a privileged role for the low-privilege
    fixture token.
  verification: the same POST to http://192.168.100.18:8080/jobs returns 403
