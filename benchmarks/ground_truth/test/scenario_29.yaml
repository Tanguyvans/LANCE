controls:
- id: C10-MQTT-AUTH@s29-mqtt-secure-a
  device: s29-mqtt-secure-a
  ip: 192.168.100.14
  role: mqtt_broker
  security_profile: hardened
  template_key: C10-MQTT-AUTH
  assertion: anonymous_mqtt_denied
  description: An unauthenticated MQTT CONNECT or wildcard subscription must be rejected.
  verification: mosquitto_sub -h 192.168.100.14 -t '#' -C 1 -W 2 must fail with authorization
    error
