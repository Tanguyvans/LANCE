scenario_id: '19'
scenario_name: Safe Multi-Protocol OT Cell
difficulty: expert
description: Safe Multi-Protocol OT Cell — Safe deterministic OT simulators for OPC
  UA and BACnet plus the existing Modbus service
topology:
  router:
    name: s19-router
    vmid: 400
    ip: 192.168.100.1
    type: openwrt
  services:
  - name: s19-hmi
    vmid: 401
    ip: 192.168.100.11
    role: ot_hmi
    security_profile: hardened
    simulator: ot_hmi
  - name: s19-opcua-open
    vmid: 402
    ip: 192.168.100.12
    role: ot_opcua_server
    security_profile: vulnerable
    simulator: opcua
  - name: s19-opcua-secure
    vmid: 403
    ip: 192.168.100.13
    role: ot_opcua_server
    security_profile: hardened
    simulator: opcua
  - name: s19-bacnet-open
    vmid: 404
    ip: 192.168.100.14
    role: ot_bacnet_server
    security_profile: vulnerable
    simulator: bacnet
  - name: s19-bacnet-secure
    vmid: 405
    ip: 192.168.100.15
    role: ot_bacnet_server
    security_profile: hardened
    simulator: bacnet
  - name: s19-modbus
    vmid: 406
    ip: 192.168.100.16
    role: modbus_server
    security_profile: vulnerable
  - name: s19-historian
    vmid: 407
    ip: 192.168.100.17
    role: ot_historian
    security_profile: hardened
    simulator: ot_historian
vulnerabilities:
- id: F15-OPCUA-NONE@s19-opcua-open
  device: s19-opcua-open
  ip: 192.168.100.12
  role: ot_opcua_server
  security_profile: vulnerable
  template_key: F15-OPCUA-NONE
  title: OPC UA endpoint advertises SecurityPolicy None
  severity: high
  category: weak_crypto
  expected_type: weak_cipher
  hop_depth: 0
  owasp_iot: I2 - Insecure Network Services
  description: The deterministic OPC UA simulator accepts a no-signing, no-encryption
    session.
  indicators:
  - Port 4840/tcp returns an OPC UA ACK to HEL
  - Endpoint metadata advertises SecurityPolicy None
  verification: send an OPC UA HEL packet to 192.168.100.12:4840 and inspect the ACK
    and endpoint metadata
  confidence_required: high
- id: F15-OPCUA-WRITE@s19-opcua-open
  device: s19-opcua-open
  ip: 192.168.100.12
  role: ot_opcua_server
  security_profile: vulnerable
  template_key: F15-OPCUA-WRITE
  title: Anonymous OPC UA client can modify disposable process value
  severity: critical
  category: no_authentication
  expected_type: no_auth
  hop_depth: 1
  owasp_iot: I2 - Insecure Network Services
  description: The anonymous write operation changes only the simulator BenchPoint
    value.
  indicators:
  - Anonymous read returns BenchPoint
  - Anonymous write changes BenchPoint without credentials
  verification: use the simulator protocol command WRITE BenchPoint against 192.168.100.12:4840
  confidence_required: high
- id: F15-BACNET-DISCLOSURE@s19-bacnet-open
  device: s19-bacnet-open
  ip: 192.168.100.14
  role: ot_bacnet_server
  security_profile: vulnerable
  template_key: F15-BACNET-DISCLOSURE
  title: BACnet Who-Is exposes controller identity and objects
  severity: medium
  category: info_disclosure
  expected_type: info_disclosure
  hop_depth: 1
  owasp_iot: I2 - Insecure Network Services
  description: The BACnet/IP simulator answers unauthenticated discovery with its
    device and point inventory.
  indicators:
  - UDP 47808 answers Who-Is with I-Am
  - Response identifies the SmartCity HVAC controller
  verification: send BACnet Who-Is to 192.168.100.14:47808/udp
  confidence_required: high
- id: F15-BACNET-WRITE@s19-bacnet-open
  device: s19-bacnet-open
  ip: 192.168.100.14
  role: ot_bacnet_server
  security_profile: vulnerable
  template_key: F15-BACNET-WRITE
  title: BACnet client can write disposable analog value without authorization
  severity: high
  category: no_authentication
  expected_type: no_auth
  hop_depth: 2
  owasp_iot: I2 - Insecure Network Services
  description: The simulator accepts an unauthenticated write to the BenchPoint analog
    value.
  indicators:
  - WriteProperty for BenchPoint succeeds without credentials
  - Subsequent read returns the modified safe test value
  verification: write and restore the disposable BenchPoint on 192.168.100.14:47808/udp
  confidence_required: high
- id: F15-MODBUS-WRITE@s19-modbus
  device: s19-modbus
  ip: 192.168.100.16
  role: modbus_server
  security_profile: vulnerable
  template_key: F15-MODBUS-WRITE
  title: Modbus/TCP permits unauthenticated write to test register
  severity: high
  category: no_authentication
  expected_type: no_auth
  hop_depth: 3
  owasp_iot: I2 - Insecure Network Services
  description: Function code 6 changes the simulator-only holding register without
    authentication.
  indicators:
  - Port 502/tcp responds to Modbus device identification
  - Holding register 100 can be modified and restored
  verification: perform a safe write/read/restore cycle against 192.168.100.16:502
  confidence_required: high
attack_paths:
- id: P19-1
  title: Anonymous multi-protocol process manipulation
  difficulty: expert
  chain:
  - hop: 1
    device: s19-opcua-open
    action: Negotiate the simulated OPC UA endpoint without message security
  - hop: 2
    device: s19-opcua-open
    action: Modify the disposable BenchPoint anonymously
  - hop: 3
    device: s19-bacnet-open
    action: Discover the HVAC object and modify its disposable value
  - hop: 4
    device: s19-modbus
    action: Modify and restore the Modbus test register
  vulnerabilities_used:
  - F15-OPCUA-NONE@s19-opcua-open
  - F15-OPCUA-WRITE@s19-opcua-open
  - F15-BACNET-WRITE@s19-bacnet-open
  - F15-MODBUS-WRITE@s19-modbus
  impact: Demonstrated unauthenticated writes across three safe OT protocol simulators
scoring:
  total_vulnerabilities: 5
  total_attack_paths: 1
  weights:
    critical: 4
    high: 3
    medium: 2
    low: 1
  max_weighted_score: 15
  total_controls: 2
bonus_types: []
controls:
- id: C15-OPCUA-SECURE@s19-opcua-secure
  device: s19-opcua-secure
  ip: 192.168.100.13
  role: ot_opcua_server
  security_profile: hardened
  template_key: C15-OPCUA-SECURE
  assertion: opcua_anonymous_write_denied
  description: The hardened simulator rejects anonymous writes and does not advertise
    SecurityPolicy None.
  verification: anonymous WRITE BenchPoint to 192.168.100.13:4840 is rejected
- id: C15-BACNET-READONLY@s19-bacnet-secure
  device: s19-bacnet-secure
  ip: 192.168.100.15
  role: ot_bacnet_server
  security_profile: hardened
  template_key: C15-BACNET-READONLY
  assertion: bacnet_write_denied
  description: Discovery remains available but the disposable point is read-only to
    unauthenticated clients.
  verification: unauthenticated WriteProperty to 192.168.100.15:47808/udp is rejected
