# Benchmark v2 scenario additions.
#
# This file is intentionally separate from main.yml: the master VM keeps
# deployment-specific values in main.yml with git's skip-worktree bit. Keeping
# the benchmark catalog here lets CI/CD update scenarios without overwriting
# the host's local network and Proxmox configuration.

scenario_vmid_ranges_v2:
  "14": 300  # S14 Sparse Mixed-Hardening → 300-310
  "15": 320  # S15 Authenticated API → 320-326
  "16": 340  # S16 Device PKI → 340-346
  "17": 360  # S17 Signed OTA → 360-366
  "18": 380  # S18 Simulated Cloud IAM → 380-386
  "19": 400  # S19 Multi-Protocol OT → 400-407

scenarios_v2:
  "14":
    name: "Sparse Mixed-Hardening"
    router_vulns: []
    services:
      - { name: mqtt-open,     vmid_offset: 1,  ip: "192.168.100.11", role: "mqtt_broker", security_profile: "vulnerable" }
      - { name: mqtt-secure,   vmid_offset: 2,  ip: "192.168.100.12", role: "mqtt_broker", security_profile: "hardened" }
      - { name: web-backup,    vmid_offset: 3,  ip: "192.168.100.13", role: "web_server", security_profile: "vulnerable" }
      - { name: web-nearmiss,  vmid_offset: 4,  ip: "192.168.100.14", role: "web_server", security_profile: "near_miss" }
      - { name: ssh-legacy,    vmid_offset: 5,  ip: "192.168.100.15", role: "ssh_server", security_profile: "vulnerable" }
      - { name: ssh-secure,    vmid_offset: 6,  ip: "192.168.100.16", role: "ssh_server", security_profile: "hardened" }
      - { name: redis-open,    vmid_offset: 7,  ip: "192.168.100.17", role: "db_server_v2", security_profile: "vulnerable" }
      - { name: redis-secure,  vmid_offset: 8,  ip: "192.168.100.18", role: "db_server_v2", security_profile: "hardened" }
      - { name: web-secure,    vmid_offset: 9,  ip: "192.168.100.19", role: "web_server", security_profile: "hardened" }
      - { name: mqtt-nearmiss, vmid_offset: 10, ip: "192.168.100.20", role: "mqtt_broker", security_profile: "near_miss" }

  "15":
    name: "Authenticated Multi-Tenant API (simulator)"
    router_vulns: []
    services:
      - { name: identity,      vmid_offset: 1, ip: "192.168.100.11", role: "api_identity_server", security_profile: "hardened", simulator: "api_identity" }
      - { name: fleet-api,     vmid_offset: 2, ip: "192.168.100.12", role: "api_tenant_server", security_profile: "vulnerable", simulator: "api_tenant" }
      - { name: audit-api,     vmid_offset: 3, ip: "192.168.100.13", role: "api_tenant_server", security_profile: "hardened", simulator: "api_tenant" }
      - { name: data-store,    vmid_offset: 4, ip: "192.168.100.14", role: "api_data_store", security_profile: "hardened", simulator: "api_data_store" }
      - { name: event-broker,  vmid_offset: 5, ip: "192.168.100.15", role: "api_event_broker", security_profile: "hardened", simulator: "api_event_broker" }
      - { name: admin-portal,  vmid_offset: 6, ip: "192.168.100.16", role: "api_admin_portal", security_profile: "near_miss", simulator: "api_portal" }

  "16":
    name: "Device PKI Lifecycle (simulator + OpenSSL)"
    router_vulns: []
    services:
      - { name: pki-ca,      vmid_offset: 1, ip: "192.168.100.11", role: "pki_ca_server", security_profile: "vulnerable", simulator: "pki_ca" }
      - { name: enrollment,  vmid_offset: 2, ip: "192.168.100.12", role: "pki_enrollment_server", security_profile: "vulnerable", simulator: "pki_enrollment" }
      - { name: device-api,  vmid_offset: 3, ip: "192.168.100.13", role: "pki_mtls_server", security_profile: "vulnerable", simulator: "pki_mtls" }
      - { name: registry,    vmid_offset: 4, ip: "192.168.100.14", role: "pki_registry", security_profile: "hardened", simulator: "pki_registry" }
      - { name: device-a,    vmid_offset: 5, ip: "192.168.100.15", role: "pki_device", security_profile: "hardened", simulator: "pki_device_unique" }
      - { name: device-b,    vmid_offset: 6, ip: "192.168.100.16", role: "pki_device", security_profile: "cloned", simulator: "pki_device_clone" }

  "17":
    name: "Stateful Signed OTA (simulator)"
    router_vulns: []
    services:
      - { name: ota-repo, vmid_offset: 1, ip: "192.168.100.11", role: "ota_repository", security_profile: "vulnerable", simulator: "ota_repository" }
      - { name: ota-api,  vmid_offset: 2, ip: "192.168.100.12", role: "ota_server", security_profile: "vulnerable", simulator: "ota_server" }
      - { name: device-a, vmid_offset: 3, ip: "192.168.100.13", role: "ota_device", security_profile: "vulnerable", simulator: "ota_device" }
      - { name: device-b, vmid_offset: 4, ip: "192.168.100.14", role: "ota_device", security_profile: "key_reuse", simulator: "ota_device" }
      - { name: signer,   vmid_offset: 5, ip: "192.168.100.15", role: "ota_signer", security_profile: "hardened", simulator: "ota_signer" }
      - { name: monitor,  vmid_offset: 6, ip: "192.168.100.16", role: "ota_monitor", security_profile: "hardened", simulator: "ota_monitor" }

  "18":
    name: "Simulated Cloud IAM and SSRF"
    router_vulns: []
    services:
      - { name: cloud-web,     vmid_offset: 1, ip: "192.168.100.11", role: "cloud_web_server", security_profile: "vulnerable", simulator: "cloud_web" }
      - { name: metadata,      vmid_offset: 2, ip: "192.168.100.12", role: "cloud_metadata_server", security_profile: "vulnerable", simulator: "cloud_metadata" }
      - { name: cloud-control, vmid_offset: 3, ip: "192.168.100.13", role: "cloud_control_plane", security_profile: "vulnerable", simulator: "cloud_control" }
      - { name: worker,        vmid_offset: 4, ip: "192.168.100.14", role: "cloud_worker", security_profile: "hardened", simulator: "cloud_worker" }
      - { name: audit,         vmid_offset: 5, ip: "192.168.100.15", role: "cloud_audit", security_profile: "hardened", simulator: "cloud_audit" }
      - { name: public-api,    vmid_offset: 6, ip: "192.168.100.16", role: "cloud_web_server", security_profile: "hardened", simulator: "cloud_web" }

  "19":
    name: "Safe Multi-Protocol OT Cell (simulator)"
    router_vulns: []
    services:
      - { name: hmi,           vmid_offset: 1, ip: "192.168.100.11", role: "ot_hmi", security_profile: "hardened", simulator: "ot_hmi" }
      - { name: opcua-open,    vmid_offset: 2, ip: "192.168.100.12", role: "ot_opcua_server", security_profile: "vulnerable", simulator: "opcua" }
      - { name: opcua-secure,  vmid_offset: 3, ip: "192.168.100.13", role: "ot_opcua_server", security_profile: "hardened", simulator: "opcua" }
      - { name: bacnet-open,   vmid_offset: 4, ip: "192.168.100.14", role: "ot_bacnet_server", security_profile: "vulnerable", simulator: "bacnet" }
      - { name: bacnet-secure, vmid_offset: 5, ip: "192.168.100.15", role: "ot_bacnet_server", security_profile: "hardened", simulator: "bacnet" }
      - { name: modbus,        vmid_offset: 6, ip: "192.168.100.16", role: "modbus_server", security_profile: "vulnerable" }
      - { name: historian,     vmid_offset: 7, ip: "192.168.100.17", role: "ot_historian", security_profile: "hardened", simulator: "ot_historian" }

# Playbooks use the merged variables below. The original S1-S13 maps stay in
# main.yml for backward compatibility with existing master installations.
benchmark_scenario_vmid_ranges: "{{ scenario_vmid_ranges | combine(scenario_vmid_ranges_v2) }}"
benchmark_scenarios: "{{ scenarios | combine(scenarios_v2) }}"
