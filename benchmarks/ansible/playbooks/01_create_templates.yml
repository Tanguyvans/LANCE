# 01_create_templates.yml — Création des templates pour le benchmark
# Usage : ansible-playbook -i inventory.yml playbooks/01_create_templates.yml --ask-vault-pass
#
# Templates créés :
#   9000 (CT)  - tpl-debian  : LXC Debian 13 (MQTT, SSH, web, IoT Hub, DB...)
#   9001 (KVM) - tpl-openwrt : OpenWrt x86-64 23.x (routeur/firewall)
#
# Approche hybride :
#   - LXC pour tous les services Linux → léger, rapide, clonable en secondes
#   - KVM uniquement pour OpenWrt → nécessite son propre kernel (NAT, routing)

- name: Nettoyage des anciennes VMs KVM debian/nginx si présentes
  hosts: proxmox
  gather_facts: false

  tasks:
    - name: Arrêter et supprimer tpl-debian LXC (9000) si présent
      block:
        - ansible.builtin.command: pct stop 9000 --skiplock
          failed_when: false
        - ansible.builtin.command: pct destroy 9000
          failed_when: false
      tags: [never, cleanup]

    - name: Arrêter et supprimer tpl-openwrt KVM (9001) si présent
      block:
        - ansible.builtin.command: qm stop 9001 --skiplock
          failed_when: false
        - ansible.builtin.command: qm destroy 9001 --purge
          failed_when: false
      tags: [never, cleanup]


- name: Template LXC — Debian 13
  hosts: proxmox
  gather_facts: false

  vars:
    debian_lxc_vmid: 9000
    debian_lxc_name: tpl-debian

  tasks:
    - name: Mettre à jour la liste des templates LXC disponibles
      ansible.builtin.command: pveam update
      changed_when: false
      tags: [lxc]

    - name: Récupérer le nom exact du template Debian 13 disponible
      ansible.builtin.command: pveam available --section system
      register: pveam_list
      changed_when: false
      tags: [lxc]

    - name: Extraire le nom du template Debian 13
      ansible.builtin.set_fact:
        # Format pveam : "system   debian-13-standard_x.y_amd64.tar.zst   232 MiB"
        # split()[1] = deuxième colonne = nom du template
        debian_lxc_tpl: "{{ (pveam_list.stdout_lines
                            | select('search', 'debian-13')
                            | list | first).split()[1] }}"
      tags: [lxc]

    - name: Afficher le template sélectionné
      ansible.builtin.debug:
        msg: "Template LXC sélectionné : {{ debian_lxc_tpl }}"
      tags: [lxc]

    - name: Télécharger le template Debian 13 sur le stockage local
      ansible.builtin.command: pveam download local {{ debian_lxc_tpl }}
      register: pveam_dl
      changed_when: "'already exists' not in pveam_dl.stderr"
      failed_when: pveam_dl.rc != 0 and 'already exists' not in pveam_dl.stderr
      tags: [lxc]

    - name: Vérifier si le CT tpl-debian (9000) existe déjà
      ansible.builtin.command: pct status {{ debian_lxc_vmid }}
      register: ct_debian_check
      changed_when: false
      failed_when: false
      tags: [lxc]

    - name: Lire le CT 9000 existant avant de le réutiliser
      ansible.builtin.command: pct config {{ debian_lxc_vmid }}
      register: ct_debian_config
      changed_when: false
      failed_when: false
      when: ct_debian_check.rc == 0
      tags: [lxc]

    - name: Refuser un VMID 9000 qui n'est pas le template benchmark
      ansible.builtin.assert:
        that:
          - "'hostname: tpl-debian' in ct_debian_config.stdout"
          - "'template: 1' in ct_debian_config.stdout"
        fail_msg: >-
          VMID 9000 existe mais n'est pas le template benchmark tpl-debian.
          Aucun objet existant ne sera remplacé.
      when: ct_debian_check.rc == 0
      tags: [lxc]

    - name: Créer le CT LXC Debian 13 de base
      ansible.builtin.command: >-
        pct create {{ debian_lxc_vmid }}
        local:vztmpl/{{ debian_lxc_tpl }}
        --hostname {{ debian_lxc_name }}
        --memory 512
        --swap 0
        --cores 1
        --net0 name=eth0,bridge=vmbr0,ip=dhcp
        --unprivileged 1
        --features nesting=1
        --storage {{ proxmox_storage }}
        --rootfs {{ proxmox_storage }}:5
        --password benchmark
        --ssh-public-keys /root/.ssh/authorized_keys
      when: ct_debian_check.rc != 0
      tags: [lxc]

    - name: Démarrer le CT pour l'initialiser
      ansible.builtin.command: pct start {{ debian_lxc_vmid }}
      when: ct_debian_check.rc != 0
      tags: [lxc]

    - name: Attendre que le CT soit prêt
      ansible.builtin.pause:
        seconds: 10
      when: ct_debian_check.rc != 0
      tags: [lxc]

    # Pointer l'apt du template vers le cache apt-cacher-ng du Proxmox (:3142).
    # Baké AVANT l'install des paquets de base → le build ET tous les CT de
    # scénario clonés depuis ce template héritent du cache. apt_cache_host doit
    # être une IP du Proxmox joignable depuis le réseau benchmark (via OpenWrt NAT)
    # — par défaut proxmox_api_host (LAN). Voir 00_proxmox_init (install acng).
    - name: Configurer le cache apt dans le CT template (hérité par les CT de scénario)
      ansible.builtin.shell: |
        pct exec {{ debian_lxc_vmid }} -- bash -c 'printf "Acquire::http::Proxy \"http://{{ apt_cache_host | default(proxmox_api_host) }}:3142\";\n" > /etc/apt/apt.conf.d/00aptproxy'
      when:
        - ct_debian_check.rc != 0
        - benchmark_use_apt_cache | bool
      changed_when: true
      tags: [lxc, aptcache]

    - name: Installer les paquets de base dans le CT
      ansible.builtin.command: >-
        pct exec {{ debian_lxc_vmid }} --
        bash -c "apt-get update -qq &&
                 apt-get install -y -qq openssh-server python3 curl wget"
      when: ct_debian_check.rc != 0
      tags: [lxc]

    - name: Arrêter le CT avant de le convertir en template
      ansible.builtin.command: pct stop {{ debian_lxc_vmid }}
      when: ct_debian_check.rc != 0
      tags: [lxc]

    - name: Convertir le CT en template LXC
      ansible.builtin.command: pct template {{ debian_lxc_vmid }}
      when: ct_debian_check.rc != 0
      tags: [lxc]

    - name: "[tpl-debian LXC] OK"
      ansible.builtin.debug:
        msg: "Template LXC tpl-debian ({{ debian_lxc_vmid }}) prêt"


- name: Template KVM — OpenWrt (routeur/firewall)
  hosts: proxmox
  gather_facts: false

  vars:
    openwrt_vmid: 9001
    openwrt_img: "openwrt-23.05-x86-64-combined-ext4.img"
    openwrt_url: "https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-23.05.5-x86-64-generic-ext4-combined.img.gz"

  tasks:
    - name: Vérifier si tpl-openwrt (9001) existe déjà
      ansible.builtin.command: qm status {{ openwrt_vmid }}
      register: tpl_openwrt_check
      changed_when: false
      failed_when: false
      tags: [tpl-openwrt]

    - name: Lire la VM 9001 existante avant de la réutiliser
      ansible.builtin.command: qm config {{ openwrt_vmid }}
      register: tpl_openwrt_config
      changed_when: false
      failed_when: false
      when: tpl_openwrt_check.rc == 0
      tags: [tpl-openwrt]

    - name: Refuser un VMID 9001 qui n'est pas le template benchmark
      ansible.builtin.assert:
        that:
          - "'name: tpl-openwrt' in tpl_openwrt_config.stdout"
          - "'template: 1' in tpl_openwrt_config.stdout"
        fail_msg: >-
          VMID 9001 existe mais n'est pas le template benchmark tpl-openwrt.
          Aucun objet existant ne sera remplacé.
      when: tpl_openwrt_check.rc == 0
      tags: [tpl-openwrt]

    - name: Télécharger l'image OpenWrt
      ansible.builtin.get_url:
        url: "{{ openwrt_url }}"
        dest: "{{ proxmox_images_dir }}/{{ openwrt_img }}.gz"
        mode: "0644"
        timeout: 300
      when: tpl_openwrt_check.rc != 0
      tags: [tpl-openwrt]

    - name: Décompresser l'image OpenWrt
      ansible.builtin.command:
        cmd: gunzip -f "{{ proxmox_images_dir }}/{{ openwrt_img }}.gz"
        creates: "{{ proxmox_images_dir }}/{{ openwrt_img }}"
      when: tpl_openwrt_check.rc != 0
      failed_when: false
      tags: [tpl-openwrt]

    - name: Convertir l'image OpenWrt en qcow2
      ansible.builtin.command:
        cmd: >-
          qemu-img convert -f raw -O qcow2
          {{ proxmox_images_dir }}/{{ openwrt_img }}
          {{ proxmox_images_dir }}/openwrt-23.05-x86-64.qcow2
        creates: "{{ proxmox_images_dir }}/openwrt-23.05-x86-64.qcow2"
      when: tpl_openwrt_check.rc != 0
      tags: [tpl-openwrt]

    - name: Créer la VM OpenWrt
      ansible.builtin.command: >-
        qm create {{ openwrt_vmid }}
        --name tpl-openwrt
        --memory 256
        --cores 1
        --net0 virtio,bridge={{ benchmark_bridge }}
        --net1 virtio,bridge=vmbr0
        --ostype l26
        --serial0 socket
        --vga serial0
      when: tpl_openwrt_check.rc != 0
      tags: [tpl-openwrt]

    - name: Importer le disque OpenWrt
      ansible.builtin.command: >-
        qm importdisk {{ openwrt_vmid }}
        {{ proxmox_images_dir }}/openwrt-23.05-x86-64.qcow2
        {{ proxmox_storage }}
      when: tpl_openwrt_check.rc != 0
      tags: [tpl-openwrt]

    - name: Configurer le boot OpenWrt
      ansible.builtin.command: >-
        qm set {{ openwrt_vmid }}
        --scsihw virtio-scsi-pci
        --virtio0 {{ proxmox_storage }}:vm-{{ openwrt_vmid }}-disk-0
        --boot c
        --bootdisk virtio0
      when: tpl_openwrt_check.rc != 0
      tags: [tpl-openwrt]

    - name: Redimensionner le disque OpenWrt à 1 Go
      ansible.builtin.command: qm disk resize {{ openwrt_vmid }} virtio0 1G
      when: tpl_openwrt_check.rc != 0
      failed_when: false
      tags: [tpl-openwrt]

    - name: Convertir la VM OpenWrt en template
      ansible.builtin.command: qm template {{ openwrt_vmid }}
      when: tpl_openwrt_check.rc != 0
      tags: [tpl-openwrt]

    - name: "[tpl-openwrt KVM] OK"
      ansible.builtin.debug:
        msg: "Template KVM tpl-openwrt ({{ openwrt_vmid }}) prêt"


    # ── Exposition LAN sur benchmark_lan_nic ──
    - name: "[LAN] Vérifier que {{ benchmark_lan_nic }} existe sur ce Proxmox"
      ansible.builtin.command: ip link show {{ benchmark_lan_nic }}
      register: lan_nic_check
      changed_when: false
      failed_when: false
      when: benchmark_expose_physical_lan | bool

    - name: "[LAN] Avertir si {{ benchmark_lan_nic }} absent (machine avec une seule NIC ?)"
      ansible.builtin.debug:
        msg: "AVERTISSEMENT : {{ benchmark_lan_nic }} introuvable sur ce Proxmox — exposition LAN ignorée. Modifier benchmark_lan_nic dans group_vars/all.yml si nécessaire."
      when: benchmark_expose_physical_lan | bool and lan_nic_check.rc != 0

    - name: "[LAN] Vérifier que {{ benchmark_lan_nic }} n'est pas déjà dans vmbr1"
      ansible.builtin.slurp:
        src: /etc/network/interfaces
      register: current_interfaces
      when: benchmark_expose_physical_lan | bool and lan_nic_check.rc == 0

    - name: "[LAN] Ajouter {{ benchmark_lan_nic }} au bridge vmbr1"
      ansible.builtin.replace:
        path: /etc/network/interfaces
        regexp: "(iface vmbr1 inet manual\n(?:.*\n)*?)(\\s+bridge-ports none)"
        replace: "\\1        bridge-ports {{ benchmark_lan_nic }}"
      when: benchmark_expose_physical_lan | bool and lan_nic_check.rc == 0 and not ((current_interfaces.content | b64decode) is search('bridge-ports.*' + benchmark_lan_nic))
      notify: reload network

    - name: "[LAN] Fallback — ajouter bridge-ports si absent"
      ansible.builtin.lineinfile:
        path: /etc/network/interfaces
        insertafter: "iface vmbr1 inet manual"
        line: "        bridge-ports {{ benchmark_lan_nic }}"
        state: present
      when: benchmark_expose_physical_lan | bool and lan_nic_check.rc == 0 and not ((current_interfaces.content | b64decode) is search('bridge-ports.*' + benchmark_lan_nic))
      notify: reload network

    # ── Résumé ──
    - name: Résumé des templates
      ansible.builtin.debug:
        msg: |
          ═══════════════════════════════════════════════════════
          Templates disponibles :
            9000  (CT  LXC) tpl-debian  → Debian 13, base pour tous les services
            {{ openwrt_vmid }}  (KVM    ) tpl-openwrt → OpenWrt 23.05, routeur/firewall (brut)
          ───────────────────────────────────────────────────────
          {% if benchmark_expose_physical_lan | bool %}
          LAN benchmark exposé sur {{ benchmark_lan_nic }} ({{ benchmark_bridge }})
          {% else %}
          LAN benchmark interne uniquement sur {{ benchmark_bridge }} (aucune NIC physique)
          {% endif %}
          ═══════════════════════════════════════════════════════
          Prochaine étape : 02_config_openwrt.yml (configure le template OpenWrt → VMID 9010)

  handlers:
    - name: reload network
      ansible.builtin.command: ifreload -a
      changed_when: true
