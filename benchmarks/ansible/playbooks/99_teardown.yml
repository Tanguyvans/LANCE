# 99_teardown.yml — Suppression de toutes les VMs d'un scénario
# Usage : ansible-playbook -i inventory.yml playbooks/99_teardown.yml \
#           --ask-vault-pass --extra-vars "scenario_id=1"

- name: Teardown scénario {{ scenario_id | default('?') }}
  hosts: proxmox
  gather_facts: false

  vars:
    scenario_id: "1"
    source_scenario_id: "{{ scenario_id }}"
    base_vmid: "{{ benchmark_scenario_vmid_ranges[scenario_id] | int }}"
    max_vmid_offset: "{{ benchmark_scenarios[scenario_id].services | map(attribute='vmid_offset') | max | int }}"
    # Plage dynamique : router (base+0) jusqu'au plus grand vmid_offset
    vmid_range: "{{ range(base_vmid | int, base_vmid | int + max_vmid_offset | int + 1) | list }}"

  tasks:

    - name: Vérifier que le VMID routeur appartient au scénario avant suppression
      ansible.builtin.shell: |
        set -euo pipefail
        vmid={{ base_vmid }}
        expected='{{ router_name | default("s" ~ scenario_id ~ "-router") }}'
        if qm status "$vmid" >/dev/null 2>&1; then
          actual=$(qm config "$vmid" | awk -F': ' '$1 == "name" {print $2; exit}')
          [ "$actual" = "$expected" ] || {
            echo "REFUS: VMID $vmid appartient à la VM '$actual', attendu '$expected'" >&2
            exit 1
          }
        elif pct status "$vmid" >/dev/null 2>&1; then
          actual=$(pct config "$vmid" | awk -F': ' '$1 == "hostname" {print $2; exit}')
          echo "REFUS: VMID $vmid appartient au CT '$actual', attendu la VM '$expected'" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      register: teardown_router_owner_check
      changed_when: false
      failed_when: false

    - name: Vérifier les VMID services avant suppression
      ansible.builtin.shell: |
        set -euo pipefail
        vmid={{ base_vmid | int + item.vmid_offset }}
        expected='{{ item.deploy_name | default("s" ~ scenario_id ~ "-" ~ item.name) }}'
        if pct status "$vmid" >/dev/null 2>&1; then
          actual=$(pct config "$vmid" | awk -F': ' '$1 == "hostname" {print $2; exit}')
          [ "$actual" = "$expected" ] || {
            echo "REFUS: VMID $vmid appartient au CT '$actual', attendu '$expected'" >&2
            exit 1
          }
        elif qm status "$vmid" >/dev/null 2>&1; then
          actual=$(qm config "$vmid" | awk -F': ' '$1 == "name" {print $2; exit}')
          echo "REFUS: VMID $vmid appartient à la VM '$actual', attendu le CT '$expected'" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      register: teardown_service_owner_checks
      changed_when: false
      failed_when: false

    - name: Bloquer le teardown si le routeur n'appartient pas au scénario
      ansible.builtin.fail:
        msg: "{{ teardown_router_owner_check.stderr | default(teardown_router_owner_check.stdout) }}"
      when: teardown_router_owner_check.rc != 0

    - name: Bloquer le teardown si un service n'appartient pas au scénario
      ansible.builtin.fail:
        msg: "{{ item.stderr | default(item.stdout) }}"
      loop: "{{ teardown_service_owner_checks.results }}"
      when: item.rc != 0

    - name: Arrêter toutes les VMs KVM du scénario
      ansible.builtin.command: qm stop {{ item }} --skiplock
      failed_when: false
      loop: "{{ vmid_range }}"

    - name: Supprimer toutes les VMs KVM du scénario
      ansible.builtin.command: qm destroy {{ item }} --purge
      failed_when: false
      loop: "{{ vmid_range }}"

    - name: Arrêter tous les CTs LXC du scénario
      ansible.builtin.command: pct stop {{ item }} --skiplock
      failed_when: false
      loop: "{{ vmid_range }}"

    - name: Supprimer tous les CTs LXC du scénario
      ansible.builtin.command: pct destroy {{ item }}
      failed_when: false
      loop: "{{ vmid_range }}"

    - name: Scénario S{{ scenario_id }} supprimé
      ansible.builtin.debug:
        msg: "Toutes les VMs {{ base_vmid }}–{{ base_vmid | int + max_vmid_offset | int }} ont été supprimées."
