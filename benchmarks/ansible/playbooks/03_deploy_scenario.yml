# 03_deploy_scenario.yml — Déploiement des VMs d'un scénario benchmark
# Usage : ansible-playbook -i inventory.yml playbooks/03_deploy_scenario.yml \
#           --ask-vault-pass --extra-vars "scenario_id=1"
#
# Scénarios disponibles (vue fusionnée dans group_vars/all/scenarios_v2.yml) :
#   1-7  — Scénarios de base (Flat, Gateway, NATO Lab, Segmenté, Building, Domotique, Edge-Cloud)
#   8-10 — Scénarios étendus (Multi-zone IT/IoT/OT, Mesh IoT, Flat variantes)
#   11   — Smart City 3 zones (15 VMs, VMIDs 220-234)
#   12   — Smart City Large Scale (35 VMs, VMIDs 235-269)
#
# Chaque scénario tourne de façon isolée sur vmbr1 (un seul scénario à la fois).
# Pour supprimer un scénario : 99_teardown.yml --extra-vars "scenario_id=1"

- name: Déploiement du scénario {{ scenario_id | default('?') }}
  hosts: proxmox
  gather_facts: false

  vars:
    scenario_id: "1"   # override avec --extra-vars "scenario_id=2"
    base_vmid: "{{ benchmark_scenario_vmid_ranges[scenario_id] | int }}"
    max_vmid_offset: "{{ benchmark_scenarios[scenario_id].services | map(attribute='vmid_offset') | max | int }}"
    # benchmark_scenarios fusionne main.yml (S1-S13) et scenarios_v2.yml (S14-S29)

  tasks:

    - name: Vérifier que le scénario est défini
      ansible.builtin.fail:
        msg: "scenario_id={{ scenario_id }} non défini. Valeurs valides : {{ benchmark_scenarios.keys() | sort | join(', ') }}"
      when: scenario_id not in benchmark_scenarios

    - name: Vérifier que le template Debian ({{ tpl_debian_vmid }}) existe
      ansible.builtin.command: pct status {{ tpl_debian_vmid }}
      register: tpl_debian_check
      changed_when: false
      failed_when: false

    - name: Bloquer si template Debian absent
      ansible.builtin.fail:
        msg: "Template Debian ({{ tpl_debian_vmid }}) introuvable. Lancer d'abord : ansible-playbook -i inventory.yml playbooks/01_create_templates.yml --ask-vault-pass"
      when: tpl_debian_check.rc != 0

    - name: Vérifier que le template OpenWrt ({{ tpl_openwrt_vmid }}) existe
      ansible.builtin.command: qm status {{ tpl_openwrt_vmid }}
      register: tpl_openwrt_check
      changed_when: false
      failed_when: false

    - name: Bloquer si template OpenWrt absent
      ansible.builtin.fail:
        msg: "Template OpenWrt ({{ tpl_openwrt_vmid }}) introuvable. Lancer d'abord : ansible-playbook -i inventory.yml playbooks/02_config_openwrt.yml --ask-vault-pass"
      when: tpl_openwrt_check.rc != 0

    - name: Détecter si un autre scénario est déjà en cours
      ansible.builtin.shell: |
        running=$(
          { qm list 2>/dev/null | awk 'NR>1 && $3=="running" {print $1}';
            pct list 2>/dev/null | awk 'NR>1 && $2=="running" {print $1}'; }
        )
        conflict_scenario=""
        for vmid in $running; do
          {% for sid, sbase in benchmark_scenario_vmid_ranges.items() %}
          if [ "$vmid" -ge "{{ sbase }}" ] && [ "$vmid" -le "{{ (sbase | int) + (benchmark_scenarios[sid].services | map(attribute='vmid_offset') | max | int) }}" ]; then
            if [ "{{ sid }}" = "{{ scenario_id }}" ]; then
              continue
            fi
            conflict_scenario="{{ sid }}"
            break
          fi
          {% endfor %}
          [ -n "$conflict_scenario" ] && break
        done
        if [ -n "$conflict_scenario" ]; then
          echo "CONFLICT:$conflict_scenario"
          exit 1
        fi
        echo "OK"
      register: conflict_check
      changed_when: false
      failed_when: false

    - name: Bloquer si un autre scénario tourne déjà
      ansible.builtin.fail:
        msg: |
          Le scénario S{{ conflict_check.stdout | regex_replace('CONFLICT:(\d+).*', '\1') }} est déjà en cours sur vmbr1.
          Les scénarios partagent le même réseau 192.168.100.0/24 — un seul à la fois.
          Teardown d'abord :
            ansible-playbook playbooks/99_teardown.yml --extra-vars "scenario_id={{ conflict_check.stdout | regex_replace('CONFLICT:(\d+).*', '\1') }}"
      when: conflict_check.rc != 0

    - name: Afficher le scénario à déployer
      ansible.builtin.debug:
        msg: |
          Déploiement : S{{ scenario_id }} — {{ benchmark_scenarios[scenario_id].name }}
          VMID router  : {{ base_vmid }}
          VMID services: {{ base_vmid | int + 1 }} → {{ base_vmid | int + max_vmid_offset | int }}


    # ── Router OpenWrt ──
    - name: Vérifier si le router du scénario existe déjà
      ansible.builtin.command: qm status {{ base_vmid }}
      register: router_check
      changed_when: false
      failed_when: false

    - name: Cloner le template OpenWrt pour le router du scénario
      ansible.builtin.command: >-
        qm clone {{ tpl_openwrt_vmid }} {{ base_vmid }}
        --name s{{ scenario_id }}-router
        --full
      when: router_check.rc != 0

    - name: "[S13] Ajouter NIC trunk VLAN 10/20/30 au routeur (net2 — ne pas écraser le WAN net1)"
      ansible.builtin.command: >-
        qm set {{ base_vmid }} --net2 virtio,bridge={{ benchmark_bridge }},trunks=10;20;30
      when: scenario_id == '13' and router_check.rc != 0

    - name: Démarrer le router OpenWrt
      ansible.builtin.command: qm start {{ base_vmid }}
      when: router_check.rc != 0

    # Vrai check TCP du SSH OpenWrt — sans guest agent (template 9010 n'en a pas),
    # un `qm guest exec` retourne toujours "No QEMU guest agent configured".
    # vmbr1 côté Proxmox est `inet manual` (pas d'IPv4) — on lui ajoute une IP
    # temporaire pour pouvoir probe le LAN du router. Même pattern que 04_inject_vulns.
    - name: Ajouter IP temporaire 192.168.100.254 sur vmbr1 (accès OpenWrt LAN)
      ansible.builtin.command: ip addr add 192.168.100.254/24 dev vmbr1
      register: add_tmp_ip
      failed_when: false
      changed_when: add_tmp_ip.rc == 0

    - name: Attendre que le router OpenWrt soit prêt (SSH actif sur le LAN)
      ansible.builtin.wait_for:
        host: "{{ benchmark_gateway }}"
        port: 22
        timeout: 180
        delay: 5


    # ── Services LXC ──
    - name: Vérifier si chaque CT service existe déjà
      ansible.builtin.command: pct status {{ base_vmid | int + item.vmid_offset }}
      register: ct_checks
      changed_when: false
      failed_when: false
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        index_var: idx

    - name: Cloner le template Debian pour chaque service
      ansible.builtin.command: >-
        pct clone {{ tpl_debian_vmid }} {{ base_vmid | int + item.vmid_offset }}
        --hostname s{{ scenario_id }}-{{ item.name }}
        --full
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        index_var: idx
      when: ct_checks.results[idx].rc != 0

    - name: Configurer le réseau et le DNS de chaque CT
      ansible.builtin.command: >-
        pct set {{ base_vmid | int + item.vmid_offset }}
        --net0 name=eth0,bridge={{ benchmark_bridge }}{% if item.bootstrap_ip is not defined and item.vlan_id is defined %},tag={{ item.vlan_id }}{% endif %},ip={{ item.bootstrap_ip | default(item.ip) }}/24{% if item.bootstrap_ip is defined %},gw={{ benchmark_gateway }}{% elif not (item.no_gateway | default(false) | bool) %},gw={% if item.vlan_id is defined %}192.168.{{ item.vlan_id }}.1{% else %}{{ benchmark_gateway }}{% endif %}{% endif %}
        --nameserver {{ benchmark_dns }}
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        index_var: idx
      when: ct_checks.results[idx].rc != 0

    - name: "[multi-hop] Ajouter le réseau isolé principal après l'interface de bootstrap"
      ansible.builtin.command: >-
        pct set {{ base_vmid | int + item.vmid_offset }}
        --net1 name=eth1,bridge={{ benchmark_bridge }},tag={{ item.vlan_id }},ip={{ item.ip }}/24
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        index_var: idx
      when:
        - ct_checks.results[idx].rc != 0
        - item.bootstrap_ip is defined

    - name: "[multi-hop] Ajouter l'interface vers le segment de pivot suivant"
      ansible.builtin.command: >-
        pct set {{ base_vmid | int + item.vmid_offset }}
        --net{{ 2 if item.bootstrap_ip is defined else 1 }} name=eth{{ 2 if item.bootstrap_ip is defined else 1 }},bridge={{ benchmark_bridge }},tag={{ item.secondary_vlan_id }},ip={{ item.secondary_ip }}/24
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        index_var: idx
      when:
        - ct_checks.results[idx].rc != 0
        - item.secondary_ip is defined

    - name: Démarrer chaque CT service
      ansible.builtin.command: pct start {{ base_vmid | int + item.vmid_offset }}
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        index_var: idx
      when: ct_checks.results[idx].rc != 0

    - name: Attendre que chaque CT soit prêt (SSH actif)
      # Sur un Proxmox à faible RAM, un CT peut être OOM-killed pendant le boot
      # simultané de nombreux conteneurs (S11/S12 = 15-35 VMs) : on le relance
      # s'il n'est pas running, puis on vérifie SSH. Retries généreux car le boot
      # est lent sous pression mémoire.
      ansible.builtin.shell: |
        vmid={{ base_vmid | int + item.vmid_offset }}
        pct status "$vmid" | grep -q running || pct start "$vmid"
        pct exec "$vmid" -- sh -c "ss -tlnp | grep -q ':22'"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      register: ct_ssh_ready
      until: ct_ssh_ready is succeeded
      retries: 30
      delay: 8
      changed_when: false

    - name: Vérifier la connectivité réseau de chaque CT
      ansible.builtin.command: >-
        pct exec {{ base_vmid | int + item.vmid_offset }} -- ping -c1 -W2
        {% if item.no_gateway | default(false) | bool %}{{ item.ip }}{% elif item.vlan_id is defined %}192.168.{{ item.vlan_id }}.1{% else %}{{ benchmark_gateway }}{% endif %}
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        index_var: idx
      register: ct_ping
      changed_when: false
      failed_when: false

    - name: "[S13] Ajouter routes VLAN sur le master LXC (200) via OpenWrt LAN"
      ansible.builtin.shell: |
        pct exec 200 -- sh -c "
          ip route replace 192.168.10.0/24 via {{ benchmark_gateway }} dev eth1 2>/dev/null || true
          ip route replace 192.168.20.0/24 via {{ benchmark_gateway }} dev eth1 2>/dev/null || true
          ip route replace 192.168.30.0/24 via {{ benchmark_gateway }} dev eth1 2>/dev/null || true
        "
      when: scenario_id == '13'
      changed_when: true
      failed_when: false

    - name: Résumé du déploiement
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════════════════════
          Scénario S{{ scenario_id }} — {{ benchmark_scenarios[scenario_id].name }} déployé
          ──────────────────────────────────────────────────────────
          {{ base_vmid }}  s{{ scenario_id }}-router  192.168.100.1  (OpenWrt WAN=DHCP)
          {% for svc in benchmark_scenarios[scenario_id].services %}
          {{ base_vmid | int + svc.vmid_offset }}  s{{ scenario_id }}-{{ svc.name }}  {{ svc.ip }}  [{{ 'OK' if ct_ping.results[loop.index0].rc == 0 else 'NO PING' }}]
          {% endfor %}
          ──────────────────────────────────────────────────────────
          Prochaine étape : 04_inject_vulns.yml --extra-vars "scenario_id={{ scenario_id }}"
          ══════════════════════════════════════════════════════════
