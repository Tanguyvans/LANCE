# 06_verify.yml — Vérification que toutes les vulnérabilités sont actives
# Usage : ansible-playbook -i inventory.yml playbooks/06_verify.yml \
#           --ask-vault-pass --extra-vars "scenario_id=1"
#
# Pour chaque vulnérabilité injectée, ce playbook vérifie que :
#   - Les ports attendus sont ouverts
#   - Les services acceptent les connexions non authentifiées
#   - Les fichiers sensibles sont accessibles
#
# Résultat : tableau récapitulatif avec OK / FAIL par vulnérabilité

- name: Vérification des vulnérabilités — Scénario {{ scenario_id | default('?') }}
  hosts: proxmox
  gather_facts: false

  vars:
    scenario_id: "1"
    base_vmid: "{{ benchmark_scenario_vmid_ranges[scenario_id] | int }}"
    # benchmark_scenarios fusionne main.yml (S1-S13) et scenarios_v2.yml (S14-S19)

  tasks:

    - name: Vérifier que le scénario est défini
      ansible.builtin.fail:
        msg: "scenario_id={{ scenario_id }} non défini. Valeurs valides : {{ benchmark_scenarios.keys() | sort | join(', ') }}"
      when: scenario_id not in benchmark_scenarios

    # ── Ajouter IP temporaire pour accès aux CTs via vmbr1 ──
    - name: Ajouter IP temporaire 192.168.100.254 sur vmbr1
      ansible.builtin.command: ip addr add 192.168.100.254/24 dev vmbr1
      failed_when: false
      changed_when: true


    # ════════════════════════════════════════════════════
    # VÉRIFICATIONS PAR RÔLE
    # ════════════════════════════════════════════════════

    # ── MQTT : connexion anonyme ──
    - name: "[mqtt_broker] Vérifier port 1883 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':1883' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'mqtt_broker'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: mqtt_port_check
      changed_when: false

    - name: "[mqtt_broker] Vérifier allow_anonymous dans la config"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "grep -r 'allow_anonymous true' /etc/mosquitto/ && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'mqtt_broker'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: mqtt_anon_check
      changed_when: false

    - name: "[mqtt_broker] Tester connexion anonyme réelle (publish retained + subscribe)"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "mosquitto_pub -h 127.0.0.1 -t 'verify/test' -m 'ok' -r 2>&1 &&
                 mosquitto_sub -h 127.0.0.1 -t 'verify/test' -C 1 -W 3 2>&1 | grep -q 'ok' &&
                 echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'mqtt_broker'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: mqtt_conn_check
      changed_when: false
      failed_when: false

    # ── Web : directory listing ──
    - name: "[web_server] Vérifier port 80 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':80' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'web_server'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: web_port_check
      changed_when: false

    - name: "[web_server] Vérifier autoindex on dans nginx"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "grep -r 'autoindex on' /etc/nginx/ && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'web_server'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: web_autoindex_check
      changed_when: false

    - name: "[web_server] Vérifier accès au fichier sensible /backup/"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "curl -s http://127.0.0.1/backup/ | grep -qi 'db_backup\|config\|Index' &&
                 echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'web_server'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: web_listing_check
      changed_when: false
      failed_when: false

    # ── SSH : creds par défaut ──
    - name: "[ssh_server] Vérifier port 22 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':22' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'ssh_server'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: ssh_port_check
      changed_when: false

    - name: "[ssh_server] Vérifier PasswordAuthentication yes"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "grep -i 'PasswordAuthentication yes' /etc/ssh/sshd_config && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'ssh_server'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: ssh_pwauth_check
      changed_when: false

    - name: "[ssh_server] Vérifier existence user admin (compte configuré)"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "id admin &>/dev/null && getent shadow admin | cut -d: -f2 | grep -qv '!' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'ssh_server'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: ssh_creds_check
      changed_when: false
      failed_when: false

    # ── IoT Gateway : Dropbear + HTTP ──
    - name: "[iot_gateway] Vérifier Dropbear ou SSH sur port 22"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':22' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'iot_gateway'
      register: iotgw_ssh_check
      changed_when: false

    - name: "[iot_gateway] Vérifier version Dropbear (Terrapin)"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "dropbear -V 2>&1 | head -1; echo OK"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'iot_gateway'
      register: iotgw_dropbear_version
      changed_when: false
      failed_when: false

    - name: "[iot_gateway] Vérifier endpoint /admin sans auth"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "curl -s http://127.0.0.1/admin | grep -qi 'admin\|no auth' &&
                 curl -s http://127.0.0.1/api/status | grep -qi 'connections\|mqtt\|db' &&
                 echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'iot_gateway'
      register: iotgw_http_check
      changed_when: false
      failed_when: false

    # ── DB : root sans mot de passe ──
    - name: "[db_server] Vérifier port 3306 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':3306' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'db_server'
      register: db_port_check
      changed_when: false

    - name: "[db_server] Vérifier connexion root sans mot de passe"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "mysql -u root -e 'SELECT 1' &>/dev/null && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'db_server'
      register: db_nopass_check
      changed_when: false

    - name: "[db_server] Vérifier table users avec passwords en clair"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "mysql -u root -e 'SHOW DATABASES' 2>/dev/null | grep -q 'smartcity' &&
                 mysql -u root -e 'SELECT COUNT(*) FROM smartcity.users' 2>/dev/null | grep -q '[0-9]' &&
                 echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'db_server'
      register: db_data_check
      changed_when: false
      failed_when: false

    # ── Modbus : port 502 sans auth ──
    - name: "[modbus_server] Vérifier port 502 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':502' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'modbus_server'
      register: modbus_port_check
      changed_when: false
      failed_when: false

    - name: "[modbus_server] Vérifier processus modbus actif"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "systemctl is-active modbus 2>/dev/null && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'modbus_server'
      register: modbus_svc_check
      changed_when: false
      failed_when: false

    # ── Web Upload : PHP upload sans validation ──
    - name: "[web_upload] Vérifier port 80 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':80' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'web_upload'
      register: webupload_port_check
      changed_when: false

    - name: "[web_upload] Vérifier que PHP-FPM répond et que l'upload est accessible"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "curl -s http://127.0.0.1/index.php | grep -qi 'upload\|firmware' &&
                 [ -d /var/www/html/uploads ] && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'web_upload'
      register: webupload_shell_check
      changed_when: false
      failed_when: false

    # ── Camera Server : HTTP sans auth ──
    - name: "[camera_server] Vérifier port 80 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':80' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'camera_server'
      register: camera_port_check
      changed_when: false

    - name: "[camera_server] Vérifier accès /admin sans auth"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "curl -s http://127.0.0.1/admin | grep -qi 'admin' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'camera_server'
      register: camera_admin_check
      changed_when: false
      failed_when: false

    # ── NVR Server : ubnt/ubnt ──
    - name: "[nvr_server] Vérifier port 22 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':22' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'nvr_server'
      register: nvr_port_check
      changed_when: false

    - name: "[nvr_server] Vérifier existence user ubnt (compte configuré)"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "id ubnt &>/dev/null && getent shadow ubnt | cut -d: -f2 | grep -qv '!' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'nvr_server'
      register: nvr_creds_check
      changed_when: false
      failed_when: false

    - name: "[nvr_server] Vérifier config NVR avec credentials exposés"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "[ -f /opt/nvr/config/system.json ] && grep -q 'ubnt' /opt/nvr/config/system.json && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'nvr_server'
      register: nvr_config_check
      changed_when: false
      failed_when: false

    # ── S7 : Bridge MQTT config avec credentials ──
    - name: "[mqtt_broker / S7] Vérifier bridge.conf avec credentials exposés"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "[ -f /etc/mosquitto/conf.d/bridge.conf ] &&
                 grep -q 'bridge_password' /etc/mosquitto/conf.d/bridge.conf &&
                 echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: scenario_id == "7" and item.role == 'mqtt_broker'
      register: s7_bridge_check
      changed_when: false
      failed_when: false

    # ── S7 : Backup SQL cloud exposé ──
    - name: "[web_upload / S7] Vérifier backup cloud_db_backup.sql accessible"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "[ -f /var/www/html/backup/cloud_db_backup.sql ] &&
                 curl -s http://127.0.0.1/backup/cloud_db_backup.sql | grep -qi 'INSERT INTO users' &&
                 echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: scenario_id == "7" and item.role == 'web_upload'
      register: s7_backup_check
      changed_when: false
      failed_when: false

    # ── Router : Telnet + FTP ──
    - name: "[router] Vérifier port Telnet (23)"
      ansible.builtin.shell: >
        nmap -p 23 --open {{ benchmark_gateway }} 2>/dev/null | grep -q '23/tcp open' &&
        echo OK || echo FAIL
      register: router_telnet_check
      changed_when: false
      failed_when: false

    - name: "[router] Vérifier port FTP (21) — scénario 3 uniquement"
      ansible.builtin.shell: >
        nmap -p 21 --open {{ benchmark_gateway }} 2>/dev/null | grep -q '21/tcp open' &&
        echo OK || echo FAIL
      register: router_ftp_check
      changed_when: false
      failed_when: false
      when: "'ftp' in benchmark_scenarios[scenario_id].router_vulns"

    - name: "[router] Vérifier interface web admin sur WAN (80)"
      ansible.builtin.shell: >
        nmap -p 80 --open {{ benchmark_gateway }} 2>/dev/null | grep -q '80/tcp open' &&
        echo OK || echo FAIL
      register: router_wan_check
      changed_when: false
      failed_when: false
      when: "'admin_wan' in benchmark_scenarios[scenario_id].router_vulns"


    # ════════════════════════════════════════════════════
    # VÉRIFICATIONS — VARIANTES DE RÔLES (S8-S10)
    # ════════════════════════════════════════════════════

    # ── mqtt_broker_v2 : auth faible (test:test) ──
    - name: "[mqtt_broker_v2] Vérifier port 1883 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':1883' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'mqtt_broker_v2'
      register: mqttv2_port_check
      changed_when: false

    - name: "[mqtt_broker_v2] Vérifier connexion avec credentials faibles (test:test)"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "mosquitto_pub -h 127.0.0.1 -u test -P test -t 'verify/test' -m 'ok' -r 2>&1 &&
                 mosquitto_sub -h 127.0.0.1 -u test -P test -t 'verify/test' -C 1 -W 3 2>&1 | grep -q 'ok' &&
                 echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'mqtt_broker_v2'
      register: mqttv2_conn_check
      changed_when: false
      failed_when: false

    # ── ssh_server_v2 : clé privée world-readable ──
    - name: "[ssh_server_v2] Vérifier port 22 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':22' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'ssh_server_v2'
      register: sshv2_port_check
      changed_when: false

    - name: "[ssh_server_v2] Vérifier clé privée world-readable (644)"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "stat -c '%a' /home/iot-admin/.ssh/id_ed25519 2>/dev/null | grep -q '644' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'ssh_server_v2'
      register: sshv2_key_check
      changed_when: false
      failed_when: false

    - name: "[ssh_server_v2] Vérifier /etc/iot/config.json existe"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "[ -f /etc/iot/config.json ] && grep -q 'mqtt_pass' /etc/iot/config.json && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'ssh_server_v2'
      register: sshv2_config_check
      changed_when: false
      failed_when: false

    # ── web_server_v2 : Flask API sans auth ──
    - name: "[web_server_v2] Vérifier port 80 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':80' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'web_server_v2'
      register: webv2_port_check
      changed_when: false

    - name: "[web_server_v2] Vérifier /api/users retourne des credentials"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "curl -s http://127.0.0.1/api/users | grep -qi 'password' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'web_server_v2'
      register: webv2_api_check
      changed_when: false
      failed_when: false

    # ── db_server_v2 : Redis sans auth ──
    - name: "[db_server_v2] Vérifier port 6379 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':6379' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'db_server_v2'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: redis_port_check
      changed_when: false

    - name: "[db_server_v2] Vérifier Redis PING sans auth"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "redis-cli PING 2>/dev/null | grep -q 'PONG' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when:
        - item.role == 'db_server_v2'
        - (item.security_profile | default('vulnerable')) == 'vulnerable'
      register: redis_ping_check
      changed_when: false
      failed_when: false

    # ── ftp_server : vsftpd anonymous ──
    - name: "[ftp_server] Vérifier port 21 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':21' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'ftp_server'
      register: ftp_port_check
      changed_when: false

    - name: "[ftp_server] Vérifier fichiers sensibles dans /srv/ftp"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "[ -f /srv/ftp/config/network.conf ] && grep -q 'password' /srv/ftp/config/network.conf && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'ftp_server'
      register: ftp_files_check
      changed_when: false
      failed_when: false

    # ── snmp_server : community public/private ──
    - name: "[snmp_server] Vérifier port 161/udp ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "systemctl is-active snmpd 2>/dev/null && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'snmp_server'
      register: snmp_svc_check
      changed_when: false
      failed_when: false

    - name: "[snmp_server] Vérifier community string 'public' dans la config"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "grep -q 'rocommunity public' /etc/snmp/snmpd.conf && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'snmp_server'
      register: snmp_community_check
      changed_when: false
      failed_when: false

    # ── coap_server : CoAP sans DTLS ──
    - name: "[coap_server] Vérifier service CoAP actif"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "systemctl is-active coap 2>/dev/null && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'coap_server'
      register: coap_svc_check
      changed_when: false
      failed_when: false

    # ── nodered_server : Node-RED sans auth ──
    - name: "[nodered_server] Vérifier port 1880 ouvert"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "ss -tlnp | grep -q ':1880' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'nodered_server'
      register: nodered_port_check
      changed_when: false

    - name: "[nodered_server] Vérifier accès /admin sans auth"
      ansible.builtin.shell: >
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        bash -c "curl -s http://127.0.0.1:1880/admin 2>/dev/null | grep -qi 'node-red\|red' && echo OK || echo FAIL"
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      when: item.role == 'nodered_server'
      register: nodered_admin_check
      changed_when: false
      failed_when: false


    # ════════════════════════════════════════════════════
    # CONTRÔLES S14 ET SIMULATEURS S15-S19
    # ════════════════════════════════════════════════════

    - name: "[S14] Vérifier les assertions négatives sur les profils non vulnérables"
      ansible.builtin.shell: |
        set -o pipefail
        case '{{ item.role }}' in
          mqtt_broker)
            if timeout 3 pct exec {{ base_vmid | int + item.vmid_offset }} -- \
              mosquitto_sub -h 127.0.0.1 -t '#' -C 1 -W 1 >/dev/null 2>&1; then
              echo FAIL
            else
              echo OK
            fi
            ;;
          web_server)
            backup_code=$(pct exec {{ base_vmid | int + item.vmid_offset }} -- \
              curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/backup/)
            admin_code=$(pct exec {{ base_vmid | int + item.vmid_offset }} -- \
              curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/admin)
            if [ "${backup_code}" = 404 ] && [ "${admin_code}" = 401 ]; then echo OK; else echo FAIL; fi
            ;;
          ssh_server)
            pct exec {{ base_vmid | int + item.vmid_offset }} -- sshd -T \
              | grep -q '^passwordauthentication no$' && echo OK || echo FAIL
            ;;
          db_server_v2)
            pct exec {{ base_vmid | int + item.vmid_offset }} -- redis-cli PING 2>&1 \
              | grep -q 'NOAUTH' && echo OK || echo FAIL
            ;;
          *) echo FAIL ;;
        esac
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        label: "{{ item.name }} ({{ item.security_profile | default('vulnerable') }})"
      when:
        - scenario_id == '14'
        - (item.security_profile | default('vulnerable')) != 'vulnerable'
      register: s14_control_checks
      changed_when: false
      failed_when: false

    - name: "[S15-S19] Vérifier que tous les simulateurs sont actifs"
      ansible.builtin.shell: >-
        pct exec {{ base_vmid | int + item.vmid_offset }} --
        systemctl is-active --quiet nato-benchmark-simulator.service
        && echo OK || echo FAIL
      loop: "{{ benchmark_scenarios[scenario_id].services }}"
      loop_control:
        label: "{{ item.name }} ({{ item.simulator | default('no-simulator') }})"
      when:
        - scenario_id in ['15', '16', '17', '18', '19']
        - item.simulator is defined
      register: simulator_service_checks
      changed_when: false
      failed_when: false

    - name: "[S15] Vérifier authentification, IDOR, mass assignment et scope admin"
      ansible.builtin.shell: |
        set -o pipefail
        bad_login=$(pct exec {{ base_vmid | int + 1 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' -d '{"username":"tenant-a","password":"wrong"}' \
          http://127.0.0.1:8080/auth/login)
        no_token=$(pct exec {{ base_vmid | int + 2 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          http://127.0.0.1:8080/v1/devices/device-a)
        idor=$(pct exec {{ base_vmid | int + 2 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Authorization: Bearer tenant-a-read' http://127.0.0.1:8080/v1/devices/device-b)
        patch=$(pct exec {{ base_vmid | int + 2 }} -- curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
          -H 'Authorization: Bearer tenant-a-read' -H 'Content-Type: application/json' \
          -d '{"role":"admin"}' http://127.0.0.1:8080/v1/devices/device-a)
        export_code=$(pct exec {{ base_vmid | int + 2 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Authorization: Bearer tenant-a-read' http://127.0.0.1:8080/v1/admin/export)
        hardened=$(pct exec {{ base_vmid | int + 3 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Authorization: Bearer tenant-a-read' http://127.0.0.1:8080/v1/devices/device-b)
        restore_patch=$(pct exec {{ base_vmid | int + 2 }} -- curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
          -H 'Authorization: Bearer tenant-a-read' -H 'Content-Type: application/json' \
          -d '{"role":"sensor"}' http://127.0.0.1:8080/v1/devices/device-a)
        if [ "${bad_login}" = 401 ] && [ "${no_token}" = 401 ] && [ "${idor}" = 200 ] \
          && [ "${patch}" = 200 ] && [ "${export_code}" = 200 ] && [ "${hardened}" = 403 ] \
          && [ "${restore_patch}" = 200 ]; then
          echo OK
        else
          echo FAIL
        fi
      when: scenario_id == '15'
      register: s15_behavior_check
      changed_when: false
      failed_when: false

    - name: "[S16] Vérifier exposition CA, rejeu d'enrôlement, clone et révocation ignorée"
      ansible.builtin.shell: |
        set -o pipefail
        ca_exposed=$(pct exec {{ base_vmid | int + 1 }} -- curl -fsS http://127.0.0.1:8080/ca/private-key \
          | grep -c 'BEGIN.*PRIVATE KEY')
        enroll_1=$(pct exec {{ base_vmid | int + 2 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' -d '{"token":"bootstrap-device-b"}' http://127.0.0.1:8080/enroll)
        enroll_2=$(pct exec {{ base_vmid | int + 2 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' -d '{"token":"bootstrap-device-b"}' http://127.0.0.1:8080/enroll)
        invalid=$(pct exec {{ base_vmid | int + 2 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' -d '{"token":"invalid"}' http://127.0.0.1:8080/enroll)
        revoked=$(pct exec {{ base_vmid | int + 2 }} -- curl -ksS -o /dev/null -w '%{http_code}' \
          --cert /etc/nato-pki/device-b.crt --key /etc/nato-pki/device-b.key \
          https://192.168.100.13:8443/device/status)
        if pct exec {{ base_vmid | int + 2 }} -- curl -ksS -o /dev/null \
          https://192.168.100.13:8443/device/status; then
          no_certificate=FAIL
        else
          no_certificate=OK
        fi
        if [ "${ca_exposed}" -gt 0 ] && [ "${enroll_1}" = 201 ] && [ "${enroll_2}" = 201 ] \
          && [ "${invalid}" = 401 ] && [ "${revoked}" = 200 ] && [ "${no_certificate}" = OK ] \
          && cmp -s /tmp/s16-pki/device-a.public-key.sha256 /tmp/s16-pki/device-b.public-key.sha256; then
          echo OK
        else
          echo FAIL
        fi
      when: scenario_id == '16'
      register: s16_behavior_check
      changed_when: false
      failed_when: false

    - name: "[S17] Vérifier rollback, métadonnées non signées, clé partagée et contrôles"
      ansible.builtin.shell: |
        set -o pipefail
        repository=$(pct exec {{ base_vmid | int + 1 }} -- curl -fsS http://127.0.0.1:8080/firmware)
        initial_status=$(pct exec {{ base_vmid | int + 3 }} -- curl -fsS http://127.0.0.1:8080/status)
        v1=$(printf '%s' "${repository}" | python3 -c \
          'import json,sys; print(json.dumps(next(x for x in json.load(sys.stdin)["artifacts"] if x["version"] == "1")))')
        v2=$(printf '%s' "${repository}" | python3 -c \
          'import json,sys; print(json.dumps(next(x for x in json.load(sys.stdin)["artifacts"] if x["version"] == "2")))')
        tampered_metadata=$(printf '%s' "${v2}" | python3 -c \
          'import json,sys; x=json.load(sys.stdin); x["version"]="99"; print(json.dumps(x))')

        rollback=$(pct exec {{ base_vmid | int + 3 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' --data-binary "${v1}" http://127.0.0.1:8080/install)
        rolled_status=$(pct exec {{ base_vmid | int + 3 }} -- curl -fsS http://127.0.0.1:8080/status)
        unsigned_metadata=$(pct exec {{ base_vmid | int + 3 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' --data-binary "${tampered_metadata}" http://127.0.0.1:8080/install)
        restore=$(pct exec {{ base_vmid | int + 3 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' --data-binary "${v2}" http://127.0.0.1:8080/install)
        restored_status=$(pct exec {{ base_vmid | int + 3 }} -- curl -fsS http://127.0.0.1:8080/status)

        shared_key=$(pct exec {{ base_vmid | int + 4 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' --data-binary "${v2}" http://127.0.0.1:8080/install)
        isolated_rollback=$(pct exec {{ base_vmid | int + 4 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' --data-binary "${v1}" http://127.0.0.1:8080/install)
        invalid=$(pct exec {{ base_vmid | int + 3 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Content-Type: application/json' \
          -d '{"version":"1","payload":"modified","signature":"invalid"}' \
          http://127.0.0.1:8080/install)
        if printf '%s' "${repository}" | grep -q 'firmware-v1-obsolete' \
          && printf '%s' "${repository}" | grep -q 'firmware-v2-current' \
          && printf '%s' "${initial_status}" | grep -q '"version": "2"' \
          && [ "${rollback}" = 200 ] && printf '%s' "${rolled_status}" | grep -q '"version": "1"' \
          && [ "${unsigned_metadata}" = 200 ] && [ "${restore}" = 200 ] \
          && printf '%s' "${restored_status}" | grep -q '"version": "2"' \
          && [ "${shared_key}" = 200 ] && [ "${isolated_rollback}" = 409 ] \
          && [ "${invalid}" = 400 ]; then echo OK; else echo FAIL; fi
      when: scenario_id == '17'
      register: s17_behavior_check
      changed_when: false
      failed_when: false

    - name: "[S18] Vérifier chaîne SSRF→metadata→secret et variante filtrée"
      ansible.builtin.shell: |
        set -o pipefail
        if timeout 3 curl -fsS http://192.168.100.12:8080/credentials >/dev/null 2>&1; then
          direct=FAIL
        else
          direct=OK
        fi
        ssrf=$(pct exec {{ base_vmid | int + 1 }} -- curl -sS -G http://127.0.0.1:8080/fetch \
          --data-urlencode 'url=http://192.168.100.12:8080/credentials')
        secret=$(pct exec {{ base_vmid | int + 3 }} -- curl -sS \
          -H 'Authorization: Bearer metadata-object-admin-token' \
          http://127.0.0.1:8080/bucket/city-secrets)
        limited=$(pct exec {{ base_vmid | int + 3 }} -- curl -sS -o /dev/null -w '%{http_code}' \
          -H 'Authorization: Bearer limited-token' \
          http://127.0.0.1:8080/bucket/city-secrets)
        hardened=$(pct exec {{ base_vmid | int + 6 }} -- curl -sS -o /dev/null -w '%{http_code}' -G \
          http://127.0.0.1:8080/fetch --data-urlencode 'url=http://192.168.100.12:8080/credentials')
        if [ "${direct}" = OK ] && printf '%s' "${ssrf}" | grep -q 'metadata-object-admin-token' \
          && printf '%s' "${secret}" | grep -q 'CITY-CONTROL-SECRET-S18' \
          && [ "${limited}" = 403 ] && [ "${hardened}" = 403 ]; then echo OK; else echo FAIL; fi
      when: scenario_id == '18'
      register: s18_behavior_check
      changed_when: false
      failed_when: false

    - name: "[S19] Vérifier écritures OPC UA/BACnet simulées et refus hardened"
      ansible.builtin.shell: |
        set -o pipefail
        opc_policy=$(pct exec {{ base_vmid | int + 2 }} -- curl -fsS http://127.0.0.1:8080/protocol)
        opc_hardened_policy=$(pct exec {{ base_vmid | int + 3 }} -- curl -fsS http://127.0.0.1:8080/protocol)
        opc_open=$(pct exec {{ base_vmid | int + 2 }} -- python3 -c \
          "import socket;s=socket.create_connection(('127.0.0.1',4840),3);s.sendall(b'WRITE BenchPoint 22');print(s.recv(64).decode())")
        opc_secure=$(pct exec {{ base_vmid | int + 3 }} -- python3 -c \
          "import socket;s=socket.create_connection(('127.0.0.1',4840),3);s.sendall(b'WRITE BenchPoint 22');print(s.recv(64).decode())")
        bac_discovery=$(pct exec {{ base_vmid | int + 4 }} -- python3 -c \
          "import socket;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(3);s.sendto(b'WHO-IS',('127.0.0.1',47808));print(s.recvfrom(64)[0][4:].decode())")
        bac_open=$(pct exec {{ base_vmid | int + 4 }} -- python3 -c \
          "import socket;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(3);s.sendto(b'WRITE BenchPoint 22',('127.0.0.1',47808));print(s.recvfrom(64)[0].decode())")
        bac_secure=$(pct exec {{ base_vmid | int + 5 }} -- python3 -c \
          "import socket;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(3);s.sendto(b'WRITE BenchPoint 22',('127.0.0.1',47808));print(s.recvfrom(64)[0].decode())")
        opc_restore=$(pct exec {{ base_vmid | int + 2 }} -- python3 -c \
          "import socket;s=socket.create_connection(('127.0.0.1',4840),3);s.sendall(b'WRITE BenchPoint 21.5');print(s.recv(64).decode())")
        bac_restore=$(pct exec {{ base_vmid | int + 4 }} -- python3 -c \
          "import socket;s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(3);s.sendto(b'WRITE BenchPoint 21.5',('127.0.0.1',47808));print(s.recvfrom(64)[0].decode())")
        modbus=$(pct exec {{ base_vmid | int + 6 }} -- python3 -c '
        import socket, struct
        def exchange(pdu):
            with socket.create_connection(("127.0.0.1", 502), 3) as sock:
                sock.sendall(struct.pack(">HHHB", 1, 0, len(pdu) + 1, 1) + pdu)
                return sock.recv(64)[7:]
        initial = exchange(struct.pack(">BHH", 3, 99, 1))
        assert initial[:2] == bytes((3, 2))
        original = struct.unpack(">H", initial[2:4])[0]
        assert exchange(struct.pack(">BHH", 6, 99, 1234)) == struct.pack(">BHH", 6, 99, 1234)
        assert exchange(struct.pack(">BHH", 3, 99, 1)) == struct.pack(">BBH", 3, 2, 1234)
        assert exchange(struct.pack(">BHH", 6, 99, original)) == struct.pack(">BHH", 6, 99, original)
        print("MODBUS OK")
        ')
        if printf '%s' "${opc_policy}" | grep -q '"security_policy": "None"' \
          && printf '%s' "${opc_hardened_policy}" | grep -q '"security_policy": "SignAndEncrypt"' \
          && printf '%s' "${opc_open}" | grep -q '^OK' \
          && printf '%s' "${opc_secure}" | grep -q 'DENIED' \
          && printf '%s' "${bac_discovery}" | grep -q 'NATO-BENCHMARK-I-AM' \
          && printf '%s' "${bac_open}" | grep -q 'BACNET OK' \
          && printf '%s' "${bac_secure}" | grep -q 'BACNET DENIED' \
          && printf '%s' "${opc_restore}" | grep -q '^OK' \
          && printf '%s' "${bac_restore}" | grep -q 'BACNET OK' \
          && printf '%s' "${modbus}" | grep -q 'MODBUS OK'; then echo OK; else echo FAIL; fi
      when: scenario_id == '19'
      register: s19_behavior_check
      changed_when: false
      failed_when: false


    # ── Retirer IP temporaire ──
    - name: Retirer l'IP temporaire de vmbr1
      ansible.builtin.command: ip addr del 192.168.100.254/24 dev vmbr1
      failed_when: false
      changed_when: true


    # ════════════════════════════════════════════════════
    # RAPPORT FINAL
    # ════════════════════════════════════════════════════

    - name: Rapport de vérification
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════════════════════════════
          Rapport de vérification — Scénario S{{ scenario_id }}
          ══════════════════════════════════════════════════════════════════

    - name: Évaluer les résultats — consolider les checks OK/FAIL
      ansible.builtin.set_fact:
        _check_router_ok: "{{ ('telnet' not in benchmark_scenarios[scenario_id].router_vulns) or ('OK' in (router_telnet_check.stdout | default(''))) }}"
        _check_mqtt_ok:   "{{ 'FAIL' not in (mqtt_conn_check.results   | default([]) | map(attribute='stdout', default='') | join(' ')) }}"
        _check_db_ok:     "{{ 'FAIL' not in (db_nopass_check.results   | default([]) | map(attribute='stdout', default='') | join(' ')) }}"
        _check_ssh_ok:    "{{ 'FAIL' not in (ssh_creds_check.results   | default([]) | map(attribute='stdout', default='') | join(' ')) }}"
        _check_web_ok:    "{{ 'FAIL' not in (web_listing_check.results | default([]) | map(attribute='stdout', default='') | join(' ')) }}"
        _check_redis_ok:  "{{ 'FAIL' not in (redis_ping_check.results  | default([]) | map(attribute='stdout', default='') | join(' ')) }}"
        _check_modbus_ok: "{{ 'FAIL' not in (modbus_svc_check.results  | default([]) | map(attribute='stdout', default='') | join(' ')) }}"
        _check_s14_ok: >-
          {{ scenario_id != '14' or
             (('OK' in (s14_control_checks.results | default([]) | map(attribute='stdout', default='') | join(' '))) and
              ('FAIL' not in (s14_control_checks.results | default([]) | map(attribute='stdout', default='') | join(' ')))) }}
        _check_simulators_ok: >-
          {{ scenario_id not in ['15', '16', '17', '18', '19'] or
             (('OK' in (simulator_service_checks.results | default([]) | map(attribute='stdout', default='') | join(' '))) and
              ('FAIL' not in (simulator_service_checks.results | default([]) | map(attribute='stdout', default='') | join(' ')))) }}
        _check_s15_ok: "{{ scenario_id != '15' or 'OK' in (s15_behavior_check.stdout | default('')) }}"
        _check_s16_ok: "{{ scenario_id != '16' or 'OK' in (s16_behavior_check.stdout | default('')) }}"
        _check_s17_ok: "{{ scenario_id != '17' or 'OK' in (s17_behavior_check.stdout | default('')) }}"
        _check_s18_ok: "{{ scenario_id != '18' or 'OK' in (s18_behavior_check.stdout | default('')) }}"
        _check_s19_ok: "{{ scenario_id != '19' or 'OK' in (s19_behavior_check.stdout | default('')) }}"

    - name: Calculer le statut global de vérification
      ansible.builtin.set_fact:
        _verify_all_ok: >-
          {{ (_check_router_ok | bool) and (_check_mqtt_ok | bool) and
             (_check_db_ok | bool) and (_check_ssh_ok | bool) and
             (_check_web_ok | bool) and (_check_redis_ok | bool) and
             (_check_modbus_ok | bool) and (_check_s14_ok | bool) and
             (_check_simulators_ok | bool) and (_check_s15_ok | bool) and
             (_check_s16_ok | bool) and (_check_s17_ok | bool) and
             (_check_s18_ok | bool) and (_check_s19_ok | bool) }}

    - name: Bloquer si des vulnérabilités critiques sont absentes
      ansible.builtin.fail:
        msg: |
          VERIFICATION FAILED sur S{{ scenario_id }} — au moins une vulnerabilite critique est absente.
          Router Telnet: {{ 'OK' if _check_router_ok | bool else 'FAIL' }}
          MQTT anon:     {{ 'OK' if _check_mqtt_ok | bool else 'FAIL' }}
          DB root:       {{ 'OK' if _check_db_ok | bool else 'FAIL' }}
          SSH creds:     {{ 'OK' if _check_ssh_ok | bool else 'FAIL' }}
          Web listing:   {{ 'OK' if _check_web_ok | bool else 'FAIL' }}
          Redis no-auth: {{ 'OK' if _check_redis_ok | bool else 'FAIL' }}
          Modbus:        {{ 'OK' if _check_modbus_ok | bool else 'FAIL' }}
          S14 controls:  {{ 'OK' if _check_s14_ok | bool else 'FAIL' }}
          Simulators:    {{ 'OK' if _check_simulators_ok | bool else 'FAIL' }}
          S15 behavior:  {{ 'OK' if _check_s15_ok | bool else 'FAIL' }}
          S16 behavior:  {{ 'OK' if _check_s16_ok | bool else 'FAIL' }}
          S17 behavior:  {{ 'OK' if _check_s17_ok | bool else 'FAIL' }}
          S18 behavior:  {{ 'OK' if _check_s18_ok | bool else 'FAIL' }}
          S19 behavior:  {{ 'OK' if _check_s19_ok | bool else 'FAIL' }}
          Relancez 04_inject_vulns.yml avant de demarrer le pipeline LLM.
      when: not (_verify_all_ok | bool)
