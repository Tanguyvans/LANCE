name: Benchmark integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ansible-core

      - name: Validate generated ground truths
        run: python benchmarks/tools/compose_gt.py --validate

      - name: Validate benchmark deployment syntax
        working-directory: benchmarks/ansible
        env:
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
          ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote
        run: |
          bash -n files/configure_s14_control.sh files/generate_s16_pki.sh files/install_benchmark_simulator.sh
          ansible-playbook -i inventory.yml playbooks/deploy_master.yml --syntax-check

      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q

      - name: Reject whitespace errors
        run: git show --check --oneline --no-renames HEAD

  sealed-worker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build isolated worker
        run: docker build -f docker/worker.Dockerfile -t iotchainbench-worker:test .

      - name: Assert oracle files are absent
        run: |
          docker run --rm --entrypoint python3 iotchainbench-worker:test -c \
            "from pathlib import Path; assert not Path('/app/benchmarks').exists(); assert not list(Path('/app').rglob('ground_truth*'))"
