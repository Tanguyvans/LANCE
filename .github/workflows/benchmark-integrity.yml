name: Benchmark integrity

on:
  push:
    branches: [main, dev/1, dev/2]
  pull_request:
    branches: [main, dev/1, dev/2]
  workflow_dispatch:
    inputs:
      slot:
        description: 'Development instance for the selected branch (none = checks only)'
        type: choice
        default: none
        options: [none, dev-1, dev-2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts-and-scenarios:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Determine validation scope
        id: scope
        run: python3 .github/scripts/ci_scope.py

      - name: Reject whitespace errors
        env:
          SCOPE_BASE: ${{ steps.scope.outputs.base }}
        run: |
          if [ -n "$SCOPE_BASE" ]; then
            git diff --check "$SCOPE_BASE" HEAD
          else
            git show --format= --check HEAD
          fi

      - name: Set up Python
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and Ansible dependencies
        if: steps.scope.outputs.full == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ansible-core
          ansible-galaxy collection install -r benchmarks/ansible/requirements.yml

      - name: Validate generated ground truths
        if: steps.scope.outputs.full == 'true'
        run: python benchmarks/tools/compose_gt.py --validate

      - name: Validate benchmark deployment syntax
        if: steps.scope.outputs.full == 'true'
        working-directory: benchmarks/ansible
        env:
          ANSIBLE_LOCAL_TEMP: /tmp/ansible-local
          ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote
        run: |
          bash -n files/configure_s14_control.sh files/generate_s16_pki.sh files/install_benchmark_simulator.sh
          ansible-playbook -i inventory.yml playbooks/deploy_master.yml --syntax-check
          for playbook in \
            03_deploy_scenario.yml \
            04_inject_vulns.yml \
            05_populate_services.yml \
            06_verify.yml \
            08_reset_scenario.yml \
            99_teardown.yml; do
            ansible-playbook -i inventory.yml "playbooks/${playbook}" --syntax-check
          done

      - name: Run test suite
        if: steps.scope.outputs.full == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests model_training/tests

      - name: Documentation checks complete
        if: steps.scope.outputs.full == 'false'
        run: echo "Only known documentation files changed; full validation and deployment are not needed."

  sealed-worker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Determine validation scope
        id: scope
        run: python3 .github/scripts/ci_scope.py

      - name: Set up Docker Buildx
        if: steps.scope.outputs.full == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build isolated worker
        if: steps.scope.outputs.full == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker.Dockerfile
          load: true
          tags: iotchainbench-worker:test
          cache-from: type=gha,scope=sealed-worker
          cache-to: type=gha,scope=sealed-worker,mode=max,ignore-error=true,timeout=2m

      - name: Assert oracle files are absent
        if: steps.scope.outputs.full == 'true'
        run: |
          docker run --rm --entrypoint python3 iotchainbench-worker:test -c \
            "from pathlib import Path; assert not Path('/app/benchmarks').exists(); assert not list(Path('/app').rglob('ground_truth*'))"

      - name: Documentation checks complete
        if: steps.scope.outputs.full == 'false'
        run: echo "Only known documentation files changed; the worker image is unchanged."

  deploy-master:
    needs: [contracts-and-scenarios, sealed-worker-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.contracts-and-scenarios.outputs.full == 'true'
    uses: ./.github/workflows/update-master.yml

  deploy-development:
    needs: [contracts-and-scenarios, sealed-worker-image]
    if: >-
      github.event_name != 'pull_request' && needs.contracts-and-scenarios.outputs.full == 'true' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/dev/1' || github.ref == 'refs/heads/dev/2')) ||
       (github.event_name == 'workflow_dispatch' && inputs.slot != 'none' && github.ref != 'refs/heads/main'))
    uses: ./.github/workflows/update-master.yml
    with:
      slot: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.ref == 'refs/heads/dev/1' && 'dev-1' || 'dev-2') }}
