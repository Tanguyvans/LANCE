name: Pilot inspect (temporary)

# Offline archive review only: no audit, deployment, model call or raw upload.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-offline-review-nato-master
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, nato-master]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify archives and summarize on nato
        env:
          REVIEW_OUTPUT: ${{ runner.temp }}/pilot-offline-review
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = nato-master
          ip -o -4 addr show | grep -q '100\.103\.253\.86/'
          python3 scripts/benchmark/pilot_archive_review.py \
            --evidence-root /opt/nato-smartcity-iot/output/pilot-evidence \
            --output "$REVIEW_OUTPUT/summary.json"
      - name: Upload aggregate diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-offline-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot-offline-review/summary.json
          if-no-files-found: error
          retention-days: 30
