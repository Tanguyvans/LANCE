name: SSH real qualification (manual dev2)

# Manual qualification only. Evidence stays on nato; nothing is uploaded.
# Called by Benchmark integrity only for its explicit ssh_reference input.
on:
  workflow_call:
    inputs:
      provider:
        required: true
        type: string
      model:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ssh-reference-dev2
  cancel-in-progress: false

jobs:
  ssh-trial:
    runs-on: [self-hosted, nato-master]
    timeout-minutes: 35
    env:
      LANCE_LAB_LOCK: /var/lib/lance/lab.lock
      LANCE_SSH_LOCK_HELD: "1"
      TRIAL_NAME: ${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_SHA: ${{ github.sha }}
      PYTHONUNBUFFERED: "1"
      SSH_PROVIDER: ${{ inputs.provider }}
      SSH_MODEL: ${{ inputs.model }}
    steps:
      - name: Execute four real SSH arms under the shared lock
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = nato-master
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/dev/2
          exec 9>>/var/lib/lance/lab.lock
          flock -x 9
          cd /opt/lance-dev-2
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          venv/bin/python - <<'PY'
          import json, os, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open('http://127.0.0.1:8503/api/environment', timeout=10) as response:
              state = json.load(response)
          assert state['instance'] == 'dev-2' and state['lab_lock_enabled'] is True
          assert state['commit'] == os.environ['EXPECTED_SHA']
          PY
          mkdir -p output/ssh-reference
          timeout --signal=TERM --kill-after=45s 1500 \
            venv/bin/python -m benchmarks.experiments.ssh_reference_live run \
            --output "output/ssh-reference/$TRIAL_NAME" \
            --provider "$SSH_PROVIDER" --model "$SSH_MODEL" \
            --max-tool-calls 8 --max-duration-s 420 --max-cost-usd 1 --max-turns 12 \
            > "output/ssh-reference/$TRIAL_NAME.console.log" 2>&1

      - name: Recover owned resources and verify local evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = nato-master
          exec 9>>/var/lib/lance/lab.lock
          flock -x 9
          cd /opt/lance-dev-2
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          OUT="output/ssh-reference/$TRIAL_NAME"
          if [ -d "$OUT" ]; then
            if [ -f "$OUT.console.log" ]; then cp "$OUT.console.log" "$OUT/controller-console.log"; fi
            recovery_status=0
            venv/bin/python -m benchmarks.experiments.ssh_reference_live recover --output "$OUT" || recovery_status=$?
            venv/bin/python -m benchmarks.experiments.ssh_reference_live seal --output "$OUT"
            venv/bin/python -m benchmarks.experiments.ssh_reference_live summary --output "$OUT"
            exit "$recovery_status"
          fi
