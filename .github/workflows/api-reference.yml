name: API real qualification (manual dev2)

# Manual qualification only. Evidence stays on nato; nothing is uploaded.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Fixed provider (only ollama-umons is accepted)
        required: true
        default: ollama-umons
        type: choice
        options:
          - ollama-umons
      model:
        description: Model from the declared V2 panel
        required: true
        default: qwen3.8:27b
        type: choice
        options:
          - qwen3.8:27b
          - gemma4:26b-a4b-it-q4_K_M
      repetitions:
        description: Independent repetitions per posture
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  contents: read

concurrency:
  group: lance-lab-dev2
  cancel-in-progress: false

jobs:
  api-trial:
    runs-on: [self-hosted, nato-master]
    timeout-minutes: 180
    env:
      LANCE_LAB_LOCK: /var/lib/lance/lab.lock
      LANCE_API_LOCK_HELD: "1"
      TRIAL_NAME: ${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_SHA: ${{ github.sha }}
      PYTHONUNBUFFERED: "1"
      API_PROVIDER: ${{ inputs.provider }}
      API_MODEL: ${{ inputs.model }}
      API_REPETITIONS: ${{ inputs.repetitions }}
    steps:
      - name: Execute the planned API arms under the shared lock
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = nato-master
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/dev/2
          test "$API_PROVIDER" = ollama-umons
          case "$API_MODEL" in
            qwen3.8:27b|gemma4:26b-a4b-it-q4_K_M) ;;
            *) echo "Model outside the declared V2 panel" >&2; exit 1 ;;
          esac
          case "$API_REPETITIONS" in 1|2|3) ;; *)
            echo "Repetitions must be 1, 2 or 3" >&2; exit 1 ;;
          esac
          exec 9>>/var/lib/lance/lab.lock
          flock -x 9
          cd /opt/lance-dev-2
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          venv/bin/python - <<'PY'
          import json, os, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open('http://127.0.0.1:8503/api/environment', timeout=10) as response:
              state = json.load(response)
          assert state['instance'] == 'dev-2' and state['lab_lock_enabled'] is True
          assert state['commit'] == os.environ['EXPECTED_SHA']
          PY
          mkdir -p output/api-reference
          # Cost and duration are recorded, not capped. The outer timeout only
          # kills a stuck process; the arm itself is bounded by tool calls/turns.
          timeout --signal=TERM --kill-after=45s "$((300 + 2400 * API_REPETITIONS))" \
            venv/bin/python -m benchmarks.experiments.api_reference_live run \
            --output "output/api-reference/$TRIAL_NAME" \
            --provider "$API_PROVIDER" --model "$API_MODEL" --repetitions "$API_REPETITIONS" \
            --max-tool-calls 16 --max-turns 16 \
            > "output/api-reference/$TRIAL_NAME.console.log" 2>&1

      - name: Recover owned resources and verify local evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = nato-master
          exec 9>>/var/lib/lance/lab.lock
          flock -x 9
          cd /opt/lance-dev-2
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          OUT="output/api-reference/$TRIAL_NAME"
          if [ -d "$OUT" ]; then
            if [ -f "$OUT.console.log" ]; then cp "$OUT.console.log" "$OUT/controller-console.log"; fi
            recovery_status=0
            venv/bin/python -m benchmarks.experiments.api_reference_live recover --output "$OUT" || recovery_status=$?
            venv/bin/python -m benchmarks.experiments.api_reference_live seal --output "$OUT"
            venv/bin/python -m benchmarks.experiments.api_reference_live summary --output "$OUT"
            exit "$recovery_status"
          fi
