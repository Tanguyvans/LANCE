name: Update LANCE instance

# Only called after validation of the exact commit by Benchmark integrity.
on:
  workflow_call:
    inputs:
      slot:
        type: string
        default: main

permissions:
  contents: read

# Shared across all three instances, including manual deployments.
concurrency:
  group: deploy-nato-master
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, nato-master]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy validated commit with shared laboratory reservation
        shell: bash
        env:
          DEPLOY_SLOT: ${{ inputs.slot }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Tanguyvans/LANCE.git
        run: bash scripts/deployment/deploy-instance.sh "$DEPLOY_SLOT" "$DEPLOY_SHA" "$DEPLOY_BRANCH"
