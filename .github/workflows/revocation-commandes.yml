name: Revocation and queued commands (manual dev2)

# Manual challenge probe. The documentations and the journals are frozen; the
# scripts and the model read the same inputs and feed no admission;
# evidence stays on nato. No fixture is created: the only remote call is the
# provider. Run it from dev/2, like every other laboratory controller.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Fixed provider (only ollama-umons is accepted)
        required: true
        default: ollama-umons
        type: choice
        options:
          - ollama-umons
      model:
        description: Model from the declared V2 panel
        required: true
        default: qwen3.8:27b
        type: choice
        options:
          - qwen3.8:27b
          - gemma4:26b-a4b-it-q4_K_M
      lot:
        description: Documentation set (connu = written against; inedit = written after the freeze)
        required: true
        default: connu
        type: choice
        options:
          - connu
          - inedit
      repetitions:
        description: Independent repetitions per documentation
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

permissions:
  contents: read

concurrency:
  group: lance-lab-dev2
  cancel-in-progress: false

jobs:
  revocation:
    runs-on: [self-hosted, nato-master]
    timeout-minutes: 480
    env:
      LANCE_LAB_LOCK: /var/lib/lance/lab.lock
      LANCE_MQTT_LOCK_HELD: "1"
      TRIAL_NAME: ${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_SHA: ${{ github.sha }}
      PYTHONUNBUFFERED: "1"
      REV_PROVIDER: ${{ inputs.provider }}
      REV_MODEL: ${{ inputs.model }}
      REV_REPETITIONS: ${{ inputs.repetitions }}
      REV_LOT: ${{ inputs.lot }}
    steps:
      - name: Execute every approach under the shared laboratory lock
        shell: bash
        run: |
          # The rebuilt runner is unprivileged; /var/lib/lance and the instance
          # belong to root. Re-exec through passwordless sudo, as the deployment does.
          if [ "$(id -u)" != 0 ]; then
            exec sudo -n --preserve-env=RUNNER_NAME,GITHUB_EVENT_NAME,GITHUB_REF,TRIAL_NAME,EXPECTED_SHA,PYTHONUNBUFFERED,LANCE_LAB_LOCK,LANCE_MQTT_LOCK_HELD,REV_PROVIDER,REV_MODEL,REV_REPETITIONS,REV_LOT bash "$0"
          fi
          set -euo pipefail
          umask 077
          require() {
            if [ "$1" != "$2" ]; then
              echo "$3: expected '$2', observed '$1'" >&2
              exit 1
            fi
          }
          require "${RUNNER_NAME:-}" nato-master "runner name"
          require "${GITHUB_EVENT_NAME:-}" workflow_dispatch "event name"
          require "${GITHUB_REF:-}" refs/heads/dev/2 "trigger ref"
          require "${REV_PROVIDER:-}" ollama-umons "provider"
          case "$REV_MODEL" in
            qwen3.8:27b|gemma4:26b-a4b-it-q4_K_M) ;;
            *) echo "Model outside the declared V2 panel" >&2; exit 1 ;;
          esac
          case "$REV_LOT" in connu|inedit) ;; *)
            echo "Lot must be connu or inedit" >&2; exit 1 ;;
          esac
          case "$REV_REPETITIONS" in 1|2|3) ;; *)
            echo "Repetitions must be 1, 2 or 3" >&2; exit 1 ;;
          esac
          exec 9>>/var/lib/lance/lab.lock
          flock -x 9
          echo "Shared laboratory lock acquired"
          cd /opt/lance-dev-2
          require "$(git rev-parse HEAD)" "$EXPECTED_SHA" "dev-2 checkout HEAD"
          echo "dev-2 checkout matches $EXPECTED_SHA; checking the running API"
          venv/bin/python - <<'PY'
          import json, os, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open('http://127.0.0.1:8503/api/environment', timeout=10) as response:
              state = json.load(response)
          assert state['instance'] == 'dev-2' and state['lab_lock_enabled'] is True
          assert state['commit'] == os.environ['EXPECTED_SHA']
          PY
          mkdir -p output/revocation-commandes
          # The limit follows the real number of cases: 120 s per model call on
          # average (the unseen run of 2026-11-26 averaged 70 s), plus ten minutes.
          cases="$(venv/bin/python -c 'import os; from benchmarks.experiments.revocation_commandes_attente.live import load_corpus; print(len(load_corpus(os.environ["REV_LOT"])))')"
          limit="$((600 + 120 * cases * REV_REPETITIONS))"
          echo "$cases cases x $REV_REPETITIONS repetitions: time limit ${limit}s"
          status=0
          timeout --signal=TERM --kill-after=45s "$limit" \
            venv/bin/python -m benchmarks.experiments.revocation_commandes_attente.live run \
            --output "output/revocation-commandes/$TRIAL_NAME" \
            --provider "$REV_PROVIDER" --model "$REV_MODEL" \
            --lot "$REV_LOT" --repetitions "$REV_REPETITIONS" \
            > "output/revocation-commandes/$TRIAL_NAME.console.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "Controller exited with status $status" >&2
            exit "$status"
          fi

      - name: Publish counts, verdicts and spend only
        if: always()
        shell: bash
        run: |
          # The rebuilt runner is unprivileged; /var/lib/lance and the instance
          # belong to root. Re-exec through passwordless sudo, as the deployment does.
          if [ "$(id -u)" != 0 ]; then
            exec sudo -n --preserve-env=RUNNER_NAME,TRIAL_NAME,PYTHONUNBUFFERED bash "$0"
          fi
          set -euo pipefail
          umask 077
          test "$RUNNER_NAME" = nato-master
          exec 9>>/var/lib/lance/lab.lock
          flock -x 9
          cd /opt/lance-dev-2
          OUT="output/revocation-commandes/$TRIAL_NAME"
          if [ -d "$OUT" ]; then
            if [ -f "$OUT.console.log" ]; then cp "$OUT.console.log" "$OUT/controller-console.log"; fi
            venv/bin/python -m benchmarks.experiments.revocation_commandes_attente.live summary --output "$OUT" || true
          fi
