<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 420" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Partner (Polish) access via Tailscale</title>
  <desc>The nato-master-1 mini PC runs the harness and scans the Polish target network through an encrypted Tailscale bridge. The flint LLM stays internal (Corsair relay to the Dell L40) and is never exposed. An ACL only allows the scanner-to-targets direction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="420" fill="#ffffff"/>

  <rect x="24" y="64" width="300" height="312" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="44" y="88" font-size="14" font-weight="500" fill="#444441">UMONS / NATO side</text>

  <rect x="464" y="64" width="180" height="230" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="484" y="88" font-size="14" font-weight="500" fill="#444441">Polish side</text>

  <rect x="48" y="108" width="252" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="174" y="130" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">Mini PC — nato-master-1</text>
  <text x="174" y="150" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Harness (scan) · tag:scanner</text>

  <rect x="48" y="226" width="252" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="174" y="245" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">Corsair relay (SSH)</text>
  <text x="174" y="263" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">tunnel :11435</text>

  <rect x="48" y="310" width="252" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="174" y="329" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">flint — Dell L40</text>
  <text x="174" y="347" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Internal LLM, never exposed</text>

  <line x1="174" y1="166" x2="174" y2="222" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="174" y1="278" x2="174" y2="306" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="186" y="200" font-size="12" fill="#5F5E5A" text-anchor="start">LLM call</text>

  <rect x="340" y="108" width="112" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="396" y="130" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">Tailscale</text>
  <text x="396" y="150" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">WireGuard</text>

  <rect x="480" y="108" width="148" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="554" y="130" font-size="14" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Subnet router</text>
  <text x="554" y="150" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">tag:pl-target</text>

  <rect x="480" y="214" width="148" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="554" y="236" font-size="14" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Targets</text>
  <text x="554" y="254" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">IoT, network data</text>

  <text x="396" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle">scan requests</text>
  <line x1="300" y1="137" x2="336" y2="137" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="452" y1="137" x2="476" y2="137" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="554" y1="166" x2="554" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="396" y="192" font-size="12" fill="#5F5E5A" text-anchor="middle">ACL: scanner → targets</text>
  <text x="396" y="210" font-size="12" fill="#5F5E5A" text-anchor="middle">(one-way)</text>
</svg>
