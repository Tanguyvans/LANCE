<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .host-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .box-title { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 12px; fill: #334155; }
      .sub-mono { font-size: 11.5px; fill: #1e293b; }
      .arrow-lbl { font-size: 11.5px; font-weight: 600; fill: #334155; }
      .arrow-sub { font-size: 10.5px; fill: #64748b; }
    </style>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Pure white background -->
  <rect width="880" height="340" fill="#ffffff"/>

  <!-- 1. Linux Probe (Host 1) -->
  <rect x="44" y="24" width="332" height="162" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <text x="64" y="51" class="font host-title">Linux Probe (on IoT LAN)</text>

  <rect x="64" y="66" width="292" height="102" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <rect x="64" y="66" width="292" height="32" rx="9" fill="#1d4ed8"/>
  <rect x="64" y="84" width="292" height="14" fill="#1d4ed8"/>
  <text x="210" y="87" text-anchor="middle" class="font box-title">Docker: LANCE</text>
  <text x="210" y="124" text-anchor="middle" class="mono sub-mono">Dashboard: 127.0.0.1:8000</text>
  <text x="210" y="148" text-anchor="middle" class="font sub">Audit Agent · Nmap · Scope Lock</text>

  <!-- Arrow: Linux Probe <-> GPU Server -->
  <line x1="382" y1="116" x2="518" y2="116" stroke="#0f766e" stroke-width="2.2" marker-start="url(#arr-teal)" marker-end="url(#arr-teal)"/>
  <rect x="403" y="76" width="94" height="28" rx="6" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
  <text x="450" y="94" text-anchor="middle" class="font arrow-lbl" fill="#0f766e">TCP 11434</text>
  <text x="450" y="138" text-anchor="middle" class="font arrow-sub">Probe IP only</text>

  <!-- 2. GPU Server (Host 2) -->
  <rect x="524" y="24" width="312" height="162" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <text x="544" y="51" class="font host-title">GPU Server</text>

  <rect x="544" y="66" width="272" height="102" rx="9" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="544" y="66" width="272" height="32" rx="9" fill="#0f766e"/>
  <rect x="544" y="84" width="272" height="14" fill="#0f766e"/>
  <text x="680" y="87" text-anchor="middle" class="font box-title">Ollama (Local LLM)</text>
  <text x="680" y="138" text-anchor="middle" class="font sub" font-size="13px" font-weight="600">Model choice</text>

  <!-- Arrow: Linux Probe -> Target IoT Network -->
  <line x1="210" y1="186" x2="210" y2="246" stroke="#b45309" stroke-width="2.2" marker-end="url(#arr-amber)"/>
  <text x="224" y="221" class="font arrow-lbl" fill="#92400e">Authorized CIDR only</text>

  <!-- 3. Target IoT Network -->
  <rect x="64" y="252" width="292" height="64" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="210" y="279" text-anchor="middle" class="font host-title" fill="#92400e">Target IoT Network</text>
  <text x="210" y="301" text-anchor="middle" class="mono sub-mono" fill="#78350f">e.g. 10.20.0.0/24</text>
</svg>
