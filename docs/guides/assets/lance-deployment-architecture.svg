<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 21px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 12.5px; font-weight: 400; fill: #cbd5e1; }
      .panel-title { font-size: 15px; font-weight: 700; fill: #0f2942; }
      .box-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .box-sub { font-size: 11px; font-weight: 600; fill: #334155; }
      .item { font-size: 11px; fill: #334155; }
      .item-mono { font-size: 10.5px; fill: #1e293b; }
      .arrow-lbl { font-size: 10.5px; font-weight: 600; fill: #334155; }
      .arrow-sub { font-size: 10px; fill: #64748b; }
      .badge-text { font-size: 10.5px; font-weight: 700; }
      .footer-title { font-size: 11px; font-weight: 700; fill: #0f2942; }
      .footer-text { font-size: 10.5px; fill: #475569; }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="1200" height="720" fill="#f8fafc"/>

  <!-- Top header banner -->
  <rect x="0" y="0" width="1200" height="72" fill="#0f2942"/>
  <text x="32" y="33" class="font title">LANCE — Partner Deployment Architecture</text>
  <text x="32" y="55" class="font subtitle">100% Local / Air-Gapped Execution  ·  Docker Harness + Native Ollama GPU  ·  Hard Server-Side Scope Guardrails</text>

  <!-- Top-right badge -->
  <rect x="978" y="21" width="190" height="30" rx="15" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
  <text x="1073" y="40" text-anchor="middle" class="font badge-text" fill="#e0f2fe">NO CLOUD · ZERO DATA EGRESS</text>

  <!-- ====================================================================== -->
  <!-- LEFT PANEL: OPTION A (SINGLE HOST — RECOMMENDED)                       -->
  <!-- ====================================================================== -->
  <rect x="24" y="88" width="564" height="546" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="24" y="88" width="564" height="40" rx="12" fill="#eff6ff"/>
  <rect x="24" y="114" width="564" height="14" fill="#eff6ff"/>
  <line x1="24" y1="128" x2="588" y2="128" stroke="#bfdbfe" stroke-width="1"/>
  <text x="42" y="113" class="font panel-title">Option A — Single Linux + GPU Host</text>
  <rect x="444" y="97" width="128" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="508" y="112" text-anchor="middle" class="font badge-text" fill="#166534">RECOMMENDED</text>

  <!-- Operator Workstation (A) -->
  <rect x="164" y="144" width="284" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="306" y="165" text-anchor="middle" class="font box-title">Operator Workstation</text>
  <text x="306" y="184" text-anchor="middle" class="mono item-mono">Browser → http://localhost:8000</text>

  <!-- SSH Tunnel Arrow (A) -->
  <line x1="306" y1="196" x2="306" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="316" y="203" width="214" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="324" y="219" class="mono arrow-sub" fill="#334155">ssh -L 8000:localhost:8000 host</text>

  <!-- Linux Host + GPU Outer Container (A) -->
  <rect x="44" y="242" width="524" height="252" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="58" y="264" class="font box-title">Linux Host + NVIDIA GPU  (on target IoT LAN)</text>
  <rect x="394" y="249" width="160" height="22" rx="11" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="474" y="264" text-anchor="middle" class="font badge-text" fill="#166534">0 INBOUND LAN PORTS</text>

  <!-- Docker Container: LANCE (A) -->
  <rect x="56" y="282" width="224" height="196" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="56" y="282" width="224" height="28" rx="8" fill="#1d4ed8"/>
  <rect x="56" y="298" width="224" height="12" fill="#1d4ed8"/>
  <text x="168" y="301" text-anchor="middle" class="font badge-text" fill="#ffffff">Docker Container: LANCE</text>
  <text x="67" y="328" class="mono item-mono">network_mode: host</text>
  <text x="67" y="346" class="mono item-mono">LANCE_MODE=audit</text>
  <text x="67" y="366" class="font item">• UI: <tspan class="mono">127.0.0.1:8000</tspan></text>
  <text x="67" y="384" class="font item">• Agent + Nmap / ARP / SSH / MQTT</text>
  <text x="67" y="402" class="font item">• Guardrails: CIDR + Excluded IPs</text>
  <text x="67" y="420" class="font item">• Optional Grey-Box YAML Topology</text>
  <line x1="67" y1="434" x2="269" y2="434" stroke="#bfdbfe" stroke-width="1"/>
  <text x="67" y="452" class="font box-sub" fill="#1e40af">Persistent Host Volumes:</text>
  <text x="67" y="468" class="mono" font-size="9.8px" fill="#1e293b">./data (SQLite/Chroma) · ./output</text>

  <!-- Loopback Arrow LANCE <-> Ollama (A) -->
  <line x1="284" y1="380" x2="350" y2="380" stroke="#0f766e" stroke-width="2" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="317" y="357" text-anchor="middle" class="font" font-size="10px" font-weight="700" fill="#0f766e">Loopback</text>
  <text x="317" y="371" text-anchor="middle" class="mono" font-size="9.2px" fill="#0f766e">localhost</text>
  <text x="317" y="397" text-anchor="middle" class="mono" font-size="9.2px" fill="#0f766e">:11434/v1</text>

  <!-- Native Ollama (A) -->
  <rect x="354" y="282" width="202" height="196" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="354" y="282" width="202" height="28" rx="8" fill="#0f766e"/>
  <rect x="354" y="298" width="202" height="12" fill="#0f766e"/>
  <text x="455" y="301" text-anchor="middle" class="font badge-text" fill="#ffffff">Ollama (Native on GPU)</text>
  <text x="366" y="328" class="mono item-mono">127.0.0.1:11434</text>
  <text x="366" y="352" class="font box-sub" fill="#115e59">Chat Model (Agent):</text>
  <text x="366" y="369" class="mono item-mono">• flint  (tested default)</text>
  <text x="366" y="385" class="mono item-mono">• or qwen2.5:14b / 3.5:27b</text>
  <text x="366" y="410" class="font box-sub" fill="#115e59">Local Embeddings:</text>
  <text x="366" y="427" class="mono item-mono">• nomic-embed-text</text>
  <text x="366" y="444" class="font arrow-sub">(~274 MB · ChromaDB RAG)</text>
  <text x="366" y="468" class="font arrow-sub" fill="#0f766e">Direct CUDA / GPU access</text>

  <!-- Arrow to Target IoT Network (A) -->
  <line x1="168" y1="478" x2="168" y2="554" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="190" y="502" width="356" height="40" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="200" y="519" class="font arrow-lbl" fill="#92400e">Authorized probes only (LANCE_ALLOWED_CIDR)</text>
  <text x="200" y="534" class="font arrow-sub" fill="#b45309">Excluded IPs + host own IPs auto-blocked across Phases 1–6</text>

  <!-- Target IoT Network (A) -->
  <rect x="86" y="560" width="440" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="306" y="584" text-anchor="middle" class="font box-title" fill="#92400e">Authorized Target IoT Network</text>
  <text x="306" y="603" text-anchor="middle" class="mono item-mono" fill="#78350f">e.g. 10.20.0.0/24  (IoT Gateways, Sensors, Cameras, APs, Brokers)</text>

  <!-- ====================================================================== -->
  <!-- RIGHT PANEL: OPTION B (TWO-HOST — SEPARATE GPU SERVER)                 -->
  <!-- ====================================================================== -->
  <rect x="612" y="88" width="564" height="546" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="612" y="88" width="564" height="40" rx="12" fill="#f8fafc"/>
  <rect x="612" y="114" width="564" height="14" fill="#f8fafc"/>
  <line x1="612" y1="128" x2="1176" y2="128" stroke="#e2e8f0" stroke-width="1"/>
  <text x="630" y="113" class="font panel-title">Option B — Two-Host Setup (Separate GPU)</text>
  <rect x="1044" y="97" width="116" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1102" y="112" text-anchor="middle" class="font badge-text" fill="#475569">OPTIONAL</text>

  <!-- Operator Workstation (B) -->
  <rect x="646" y="144" width="240" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="766" y="165" text-anchor="middle" class="font box-title">Operator Workstation</text>
  <text x="766" y="184" text-anchor="middle" class="mono item-mono">http://localhost:8000</text>

  <!-- SSH Tunnel Arrow (B) -->
  <line x1="766" y1="196" x2="766" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <rect x="776" y="203" width="144" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="784" y="219" class="mono arrow-sub" fill="#334155">SSH Tunnel (TCP 22)</text>

  <!-- Host 1: Linux Probe (B) -->
  <rect x="632" y="242" width="234" height="252" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="644" y="264" class="font box-title">Host 1: Linux Probe</text>
  <text x="644" y="278" class="font arrow-sub">Placed on IoT LAN (no GPU needed)</text>

  <rect x="644" y="288" width="210" height="192" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="644" y="288" width="210" height="26" rx="8" fill="#1d4ed8"/>
  <rect x="644" y="302" width="210" height="12" fill="#1d4ed8"/>
  <text x="749" y="306" text-anchor="middle" class="font badge-text" fill="#ffffff">Docker: LANCE</text>
  <text x="654" y="332" class="mono item-mono">network_mode: host</text>
  <text x="654" y="350" class="font item">• UI: <tspan class="mono">127.0.0.1:8000</tspan></text>
  <text x="654" y="368" class="font item">• Audit Agent + Scanners</text>
  <text x="654" y="386" class="font item">• Scope &amp; Exclusions lock</text>
  <line x1="654" y1="400" x2="844" y2="400" stroke="#bfdbfe" stroke-width="1"/>
  <text x="654" y="418" class="font box-sub" fill="#1e40af">.env LLM Endpoint:</text>
  <text x="654" y="434" class="mono item-mono">http://&lt;GPU-IP&gt;:11434/v1</text>
  <text x="654" y="458" class="font arrow-sub">Volumes: ./data · ./output</text>

  <!-- Network Arrow Probe <-> GPU Server (B) -->
  <line x1="868" y1="382" x2="942" y2="382" stroke="#0f766e" stroke-width="2" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <rect x="869" y="346" width="72" height="28" rx="5" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="905" y="358" text-anchor="middle" class="font badge-text" fill="#991b1b">TCP 11434</text>
  <text x="905" y="370" text-anchor="middle" class="font arrow-sub" fill="#991b1b">Probe only</text>
  <text x="905" y="400" text-anchor="middle" class="font arrow-sub" fill="#0f766e">OpenAI API</text>

  <!-- Host 2: GPU Server (B) -->
  <rect x="946" y="242" width="212" height="252" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="958" y="264" class="font box-title">Host 2: GPU Server</text>
  <text x="958" y="278" class="font arrow-sub">Internal AI / GPU box</text>

  <rect x="958" y="288" width="188" height="192" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="958" y="288" width="188" height="26" rx="8" fill="#0f766e"/>
  <rect x="958" y="302" width="188" height="12" fill="#0f766e"/>
  <text x="1052" y="306" text-anchor="middle" class="font badge-text" fill="#ffffff">Ollama (GPU)</text>
  <text x="968" y="332" class="mono item-mono">0.0.0.0:11434</text>
  <text x="968" y="354" class="font box-sub" fill="#115e59">Models Served:</text>
  <text x="968" y="371" class="mono item-mono">• flint / qwen3.5:27b</text>
  <text x="968" y="387" class="mono item-mono">• nomic-embed-text</text>
  <line x1="968" y1="402" x2="1136" y2="402" stroke="#99f6e4" stroke-width="1"/>
  <text x="968" y="420" class="font box-sub" fill="#991b1b">Firewall Rule:</text>
  <text x="968" y="436" class="font item">Allow TCP 11434 from</text>
  <text x="968" y="451" class="font item">Host 1 (Probe IP) only</text>
  <text x="968" y="468" class="font arrow-sub">Drop all other LAN traffic</text>

  <!-- Arrow to Target IoT Network (B) -->
  <line x1="749" y1="480" x2="749" y2="554" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="762" y="504" width="382" height="36" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="772" y="520" class="font arrow-lbl" fill="#92400e">Authorized probes only from Host 1 (LANCE_ALLOWED_CIDR)</text>
  <text x="772" y="534" class="font arrow-sub" fill="#b45309">GPU Server never touches the target IoT network directly</text>

  <!-- Target IoT Network (B) -->
  <rect x="674" y="560" width="440" height="58" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="894" y="584" text-anchor="middle" class="font box-title" fill="#92400e">Authorized Target IoT Network</text>
  <text x="894" y="603" text-anchor="middle" class="mono item-mono" fill="#78350f">e.g. 10.20.0.0/24  (Isolated from Host 2 GPU Server)</text>

  <!-- ====================================================================== -->
  <!-- BOTTOM SUMMARY BAR                                                     -->
  <!-- ====================================================================== -->
  <rect x="24" y="648" width="1152" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Column 1 -->
  <circle cx="48" cy="675" r="5" fill="#1d4ed8"/>
  <text x="62" y="670" class="font footer-title">Delivery Options</text>
  <text x="62" y="687" class="font footer-text">Offline .tar.gz + .sha256 bundle (or read-only GHCR pull)</text>

  <line x1="416" y1="658" x2="416" y2="692" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Column 2 -->
  <circle cx="438" cy="675" r="5" fill="#b45309"/>
  <text x="452" y="670" class="font footer-title">Hard Rules of Engagement Lock</text>
  <text x="452" y="687" class="font footer-text">LANCE_ALLOWED_CIDR + LANCE_EXCLUDED_IPS enforced on every tool</text>

  <line x1="818" y1="658" x2="818" y2="692" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Column 3 -->
  <circle cx="840" cy="675" r="5" fill="#15803d"/>
  <text x="854" y="670" class="font footer-title">Automated Install Verification</text>
  <text x="854" y="687" class="font footer-text"><tspan class="mono">scripts/deployment/verify-install.sh</tspan> (12 checks)</text>
</svg>
