name: "ssh_audit"
command: "ssh-audit"
args: ["--skip-rate-test", "--no-colors"]
enabled: true
timeout: 30
short_description: "SSH configuration analyzer"
description: |
  Run ssh-audit on a host to analyze SSH configuration: key exchange, ciphers,
  MACs, host keys, and known vulnerabilities like Terrapin.
  Exit codes 2 (warnings) and 3 (algorithm failures) are audit findings, not
  execution failures. Exit code 1 is a connection error. Inspect the actual
  output before making a vulnerability claim; the exit code alone is not proof.
  The connection-rate test is skipped to avoid penalizing subsequent probes on
  servers with connection throttling. This tool does not assess DHEat resistance.
filter_lines: "^\\((?:gen|kex|key|enc|mac)\\)|\\[fail\\]|\\[warn\\]|CVE-"
max_output: 8000
parameters:
  - name: "host"
    type: "string"
    description: "Target IP or hostname"
    required: true
    format: "positional"
  - name: "port"
    type: "integer"
    description: "SSH port (default: 22)"
    required: false
    default: 22
    format: "port_suffix"
