name: "modbus_scan"
command: "nmap"
args: ["-sV", "-p", "502"]
enabled: true
timeout: 120
short_description: "Modbus TCP port scanner (port 502)"
description: |
  Detect Modbus TCP service on port 502 using nmap service version detection.
  An open port is a service-contact observation, not proof of authentication policy.
  For verification use nmap_scan with scripts=modbus-discover and require actual
  returned device identification. Never infer register read/write permissions.
  Use this tool on ICS/SCADA devices (PLCs, HMIs, historians) detected during recon.
  Safe: only detects exposure, no register writes.
parameters:
  - name: "target"
    type: "string"
    description: "Target IP or hostname of the suspected PLC/ICS device"
    required: true
    format: "positional"
  - name: "skip_discovery"
    type: "boolean"
    description: "Skip host discovery (-Pn). Use when nmap reports 'Host seems down' but ARP confirms the host is up."
    required: false
    flag: "-Pn"
    format: "boolean_flag"
