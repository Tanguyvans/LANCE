name: "telnet_connect"
handler: "python"
enabled: true
timeout: 10
short_description: "Bounded Telnet-like TCP probe"
description: >
  Open a bounded TCP connection and send a fixed identity probe (id + newline).
  A connection alone is not proof; inspect received_bytes/received_ascii.
max_output: 1000
parameters:
  - name: "host"
    type: "string"
    description: "Target host or IP"
    required: true
  - name: "port"
    type: "integer"
    description: "Target TCP port (normally 23)"
    required: true
  - name: "timeout"
    type: "integer"
    description: "Connection/read timeout in seconds, bounded by the handler"
    required: false
