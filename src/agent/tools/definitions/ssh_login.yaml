name: "ssh_login"
handler: python
enabled: true
timeout: 15
short_description: "SSH login attempt with credentials"
description: >
  Attempt SSH authentication with ip, user, password, port and a remote command
  (default id). Local shell execution is forbidden. Legacy crypto options are
  supplied by the executor. A successful remote command is access evidence,
  not automatically proof of every vulnerability on the target.
max_output: 3000
parameters:
  - name: "command_string"
    type: "string"
    description: "Deprecated compatibility input: one literal sshpass SSH command only; parsed into structured arguments, never executed by a local shell. Prefer ip/user/password/command."
    required: false
    format: "positional"
  # Some compact local models emit the structured form used by try_credential
  # instead of the historical command_string form. The Python handler validates
  # both forms and executes a fixed sshpass/ssh argument vector, without bash.
  - name: "ip"
    type: "string"
    description: "Target IP for the structured form"
    required: false
  - name: "user"
    type: "string"
    description: "SSH username for the structured form"
    required: false
  - name: "password"
    type: "string"
    description: "SSH password for the structured form"
    required: false
  - name: "command"
    type: "string"
    description: "Remote command for the structured form; defaults to id"
    required: false
  - name: "port"
    type: "integer"
    description: "SSH port for the structured form; defaults to 22"
    required: false
    default: 22
